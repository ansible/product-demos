---
- name: Register RHEL hosts with RHSM
  hosts: "{{ _hosts | default('aws_rhel*') }}"
  become: true
  ignore_unreachable: true

  vars:
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Ensure RHEL 8 uses platform-python for Ansible modules
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../cloud/tasks/use_platform_python_on_rhel8.yml"

    - name: Check OS family
      ansible.builtin.assert:
        that: ansible_os_family == 'RedHat'
        fail_msg: This job supports RHEL hosts only.

    - name: Ensure RHSM registration
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../cloud/tasks/rhsm_ensure_registered.yml"

    - name: Report RHSM registration status
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{
            'registered with RHSM' if rhsm_registered | default(false)
            else 'not registered — update the RHSM Registration credential in AAP'
          }}
