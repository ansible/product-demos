---
- name: ROSA | Preflight Checks
  hosts: localhost
  connection: local
  gather_facts: false

  environment:
    AWS_DEFAULT_REGION: "{{ rosa_aws_region | default('us-east-1') }}"

  tasks:
    - name: Validate required variables are set
      ansible.builtin.assert:
        that:
          - rosa_cluster_name | length > 0
          - rosa_aws_region | length > 0
          - rosa_token is defined and rosa_token | length > 0
        fail_msg: >-
          Missing required variables. Ensure rosa_cluster_name, rosa_aws_region,
          and rosa_token (via ROSA Token credential) are provided.
        success_msg: All required variables are present.

    - name: Validate cluster name format (lowercase alphanumeric + hyphens, max 54 chars)
      ansible.builtin.assert:
        that:
          - rosa_cluster_name is regex('^[a-z][a-z0-9-]{0,53}$')
        fail_msg: >-
          Cluster name '{{ rosa_cluster_name }}' is invalid. Must start with a lowercase
          letter, contain only lowercase alphanumeric characters and hyphens, max 54 characters.

    - name: Verify AWS CLI is available
      ansible.builtin.command:
        cmd: aws --version
      changed_when: false
      register: _aws_version

    - name: Display AWS CLI version
      ansible.builtin.debug:
        msg: "{{ _aws_version.stdout }}"

    - name: Verify ROSA CLI is available
      ansible.builtin.command:
        cmd: rosa version
      changed_when: false
      register: _rosa_version

    - name: Display ROSA CLI version
      ansible.builtin.debug:
        msg: "{{ _rosa_version.stdout }}"

    - name: Verify AWS identity (STS caller identity)
      ansible.builtin.command:
        cmd: aws sts get-caller-identity
      changed_when: false
      register: _aws_identity

    - name: Parse AWS identity
      ansible.builtin.set_fact:
        aws_caller_identity: "{{ _aws_identity.stdout | from_json }}"

    - name: Display AWS identity
      ansible.builtin.debug:
        msg: >-
          Account: {{ aws_caller_identity.Account }},
          ARN: {{ aws_caller_identity.Arn }}

    - name: Log in to ROSA
      ansible.builtin.command:
        cmd: rosa login --token={{ rosa_token }}
      changed_when: false
      no_log: true

    - name: Verify ROSA token / whoami
      ansible.builtin.command:
        cmd: rosa whoami
      changed_when: false
      register: _rosa_whoami

    - name: Display ROSA identity
      ansible.builtin.debug:
        msg: "{{ _rosa_whoami.stdout }}"

    - name: Run ROSA preflight verification
      ansible.builtin.command:
        cmd: rosa verify permissions --region {{ rosa_aws_region }}
      changed_when: false
      register: _rosa_permissions

    - name: Display permissions check result
      ansible.builtin.debug:
        msg: "{{ _rosa_permissions.stdout }}"

    - name: Verify ROSA quota
      ansible.builtin.command:
        cmd: rosa verify quota --region {{ rosa_aws_region }}
      changed_when: false
      register: _rosa_quota

    - name: Display quota check result
      ansible.builtin.debug:
        msg: "{{ _rosa_quota.stdout }}"

    - name: Check available Elastic IPs
      ansible.builtin.command:
        cmd: >-
          aws ec2 describe-addresses
          --query "Addresses[?AssociationId==null] | length(@)"
          --output text
      changed_when: false
      register: _free_eips

    - name: Check EIP quota
      ansible.builtin.command:
        cmd: >-
          aws service-quotas get-service-quota
          --service-code ec2
          --quota-code L-0263D0A3
          --query "Quota.Value"
          --output text
      changed_when: false
      register: _eip_quota

    - name: Count total allocated EIPs
      ansible.builtin.command:
        cmd: >-
          aws ec2 describe-addresses
          --query "length(Addresses)"
          --output text
      changed_when: false
      register: _total_eips

    - name: Display EIP status
      ansible.builtin.debug:
        msg: >-
          Elastic IPs — allocated: {{ _total_eips.stdout | trim }},
          unassociated: {{ _free_eips.stdout | trim }},
          quota: {{ _eip_quota.stdout | trim }}.
          ROSA requires at least 1 available EIP.

    - name: Check if cluster already exists
      ansible.builtin.command:
        cmd: rosa describe cluster --cluster={{ rosa_cluster_name }} --region={{ rosa_aws_region }}
      changed_when: false
      register: _existing_cluster
      failed_when: false

    - name: Warn if cluster already exists
      ansible.builtin.fail:
        msg: >-
          A cluster named '{{ rosa_cluster_name }}' already exists in region {{ rosa_aws_region }}.
          Destroy it first or choose a different name.
      when: _existing_cluster.rc == 0

    - name: Preflight checks passed
      ansible.builtin.debug:
        msg: >-
          All preflight checks passed. Ready to create ROSA cluster
          '{{ rosa_cluster_name }}' in {{ rosa_aws_region }}.
