---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: >
          (?x)^(
            collections/ansible_collections/demo/compliance/roles/.*|
            .*/rhel[89]STIG/.*
          )$

      - id: check-yaml
        exclude: \.j2.(yaml|yml)$|\.(yaml|yml).j2$
        args: [--unsafe]   # see https://github.com/pre-commit/pre-commit-hooks/issues/273

      - id: check-toml
      - id: check-json
      - id: check-symlinks

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["-L", "sumbit,UserA,bootup,nd"]
        exclude: >
          (?x)^(
            collections/ansible_collections/demo/compliance/roles/.*|
            .*/rhel[89]STIG/.*
          )$
        additional_dependencies:
          - tomli

  - repo: https://github.com/ansible/ansible-lint.git
    # get latest release tag from https://github.com/ansible/ansible-lint/releases/
    rev: v25.7.0
    hooks:
      - id: ansible-lint
        additional_dependencies:
          - jmespath

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 23.11.0
    hooks:
      - id: black
        exclude: >
          (?x)^(
            collections/ansible_collections/demo/compliance/roles/.*|
            .*/rhel[89]STIG/.*
          )$
...
