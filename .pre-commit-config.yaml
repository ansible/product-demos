---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: >
          (?x)^(
            collections/ansible_collections/demo/compliance/roles/.*|
            .*/rhel[89]STIG/.*
          )$

      - id: check-yaml
        exclude: \.j2.(yaml|yml)$|\.(yaml|yml).j2$
        args: [--unsafe]   # see https://github.com/pre-commit/pre-commit-hooks/issues/273

      - id: check-toml
      - id: check-json
      - id: check-symlinks

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["-L", "sumbit,UserA,bootup,nd"]
        exclude: >
          (?x)^(
            collections/ansible_collections/demo/compliance/roles/.*|
            .*/rhel[89]STIG/.*
          )$
        additional_dependencies:
          - tomli

  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-navigator lint --eei quay.io/ansible-product-demos/apd-ee-26:latest --mode stdout
        language: python
        entry: bash -c "ansible-navigator lint --eei quay.io/ansible-product-demos/apd-ee-26 -v --force-color --mode stdout"

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 23.11.0
    hooks:
      - id: black
        exclude: >
          (?x)^(
            collections/ansible_collections/demo/compliance/roles/.*|
            .*/rhel[89]STIG/.*
          )$
...
