---
# RHEL 8 ships python3 (3.6) and platform-python (3.6). Product Demos EE
# (ansible-core 2.17+) requires Python 3.8+ on managed hosts.
- name: Ensure a supported Python is installed for Ansible modules
  ansible.builtin.raw: |
    set -e
    for py in /usr/bin/python3.9 /usr/bin/python3; do
      if [ -x "$py" ] && "$py" -c 'import sys; sys.exit(0 if sys.version_info[:2] >= (3, 8) else 1)'; then
        exit 0
      fi
    done
    dnf install -y python39
    /usr/bin/python3.9 -c 'import sys; sys.exit(0 if sys.version_info[:2] >= (3, 8) else 1)'
  register: _ensure_ansible_python
  changed_when: >-
    'Installing' in (_ensure_ansible_python.stdout | default(''))
    or 'Upgrading' in (_ensure_ansible_python.stdout | default(''))
  failed_when: _ensure_ansible_python.rc != 0

- name: Detect Ansible module interpreter path
  ansible.builtin.raw: |
    for py in /usr/bin/python3.9 /usr/bin/python3; do
      if [ -x "$py" ] && "$py" -c 'import sys; sys.exit(0 if sys.version_info[:2] >= (3, 8) else 1)'; then
        echo "$py"
        exit 0
      fi
    done
    exit 1
  register: _ansible_python_path
  changed_when: false
  failed_when: _ansible_python_path.rc != 0

- name: Pin Ansible module interpreter
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ _ansible_python_path.stdout_lines | last | trim }}"

- name: Ensure DNF Python bindings for the Ansible interpreter
  ansible.builtin.raw: |
    set -e
    py="{{ ansible_python_interpreter }}"
    "$py" -c 'import dnf' 2>/dev/null || dnf install -y python39-dnf
    "$py" -c 'import dnf'
  register: _ensure_dnf_python
  changed_when: >-
    'Installing' in (_ensure_dnf_python.stdout | default(''))
    or 'Upgrading' in (_ensure_dnf_python.stdout | default(''))
  failed_when: _ensure_dnf_python.rc != 0

- name: Reset SSH connection to apply Python interpreter
  ansible.builtin.meta: reset_connection
