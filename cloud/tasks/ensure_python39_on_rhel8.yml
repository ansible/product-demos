---
# ansible-core 2.17+ modules require Python 3.8+ on targets. RHEL 8
# platform-python is 3.6; use python39 for Ansible and dnf CLI for packages.
- name: RHEL 8 Ansible module interpreter setup
  when: >-
    (ansible_distribution_major_version | default('') | string) == '8'
    or 'blueprint_rhel8' in group_names
    or inventory_hostname is search('rhel8')
  block:
    - name: Ensure Python 3.9 is installed on RHEL 8
      ansible.builtin.raw: |
        set -e
        if [ -x /usr/bin/python3.9 ]; then exit 0; fi
        dnf install -y python39
      register: _rhel8_python39
      changed_when: >-
        'Installing' in (_rhel8_python39.stdout | default(''))
        or 'Upgrading' in (_rhel8_python39.stdout | default(''))

    - name: Pin Python 3.9 for Ansible modules on RHEL 8
      ansible.builtin.set_fact:
        ansible_python_interpreter: /usr/bin/python3.9

    - name: Reset SSH connection to apply RHEL 8 interpreter
      ansible.builtin.meta: reset_connection
