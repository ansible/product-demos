---
# RHEL 8 hosts may have python39 from earlier demos. ansible-core 2.16 needs
# platform-python for dnf/package modules even when python3.9 is present.
- name: Use platform-python on RHEL 8 for Ansible modules
  ansible.builtin.set_fact:
    ansible_python_interpreter: /usr/libexec/platform-python
  when: ansible_distribution_major_version | int == 8

- name: Reset SSH connection to apply RHEL 8 interpreter
  ansible.builtin.meta: reset_connection
  when: ansible_distribution_major_version | int == 8
