---
- name: Create Cloud Infra
  hosts: localhost
  gather_facts: false

  vars:
    aws_vpc_name: aws-test-vpc
    aws_owner_tag: "{{ create_vm_aws_owner_tag | default(create_vm_vm_owner | default('apd-demo')) }}"
    aws_purpose_tag: ansible_demo
    aws_tenancy: default
    aws_vpc_cidr_block: 10.0.0.0/16
    aws_subnet_cidr: 10.0.1.0/24
    aws_sg_name: aws-test-sg
    aws_subnet_name: aws-test-subnet
    aws_rt_name: aws-test-rt

    # map of availability zones to use per region, added since not all
    # instance types are available in all AZs.  must match the drop-down
    # list for the create_vm_aws_region variable described in cloud/setup.yml
    _azs:
      us-east-1:
        - us-east-1a
        - us-east-1b
        - us-east-1c
      us-east-2:
        - us-east-2a
        - us-east-2b
        - us-east-2c
      us-west-1:
        # us-west-1a not available when last checked 20250218
        - us-west-1b
        - us-west-1c
      us-west-2:
        - us-west-2a
        - us-west-2b
        - us-west-2c

  tasks:
    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        state: present
        name: "{{ aws_vpc_name }}"
        cidr_block: "{{ aws_vpc_cidr_block }}"
        tenancy: "{{ aws_tenancy }}"
        region: "{{ create_vm_aws_region }}"
        tags:
          owner: "{{ aws_owner_tag }}"
          purpose: "{{ aws_purpose_tag }}"
      register: aws_vpc

    - name: Create internet gateway
      amazon.aws.ec2_vpc_igw:
        state: present
        vpc_id: "{{ aws_vpc.vpc.id }}"
        region: "{{ create_vm_aws_region }}"
        tags:
          Name: "{{ aws_vpc_name }}"
          owner: "{{ aws_owner_tag }}"
          purpose: "{{ aws_purpose_tag }}"
      register: aws_gateway

    # purge_rules defaults to true; keep false so Deploy Cloud Stack and Deploy
    # Shared Services can run in either order. Mattermost (8065), Gitea (3000/80/8080),
    # and Kafka (9095) add ports with purge_rules: false — a second Create VPC must
    # not strip those rules from the shared aws-test-sg.
    - name: Create security group internal
      amazon.aws.ec2_security_group:
        state: present
        name: "{{ aws_sg_name }}"
        region: "{{ create_vm_aws_region }}"
        description: Inbound WinRM and RDP, http for demo servers and internal AD ports
        purge_rules: false
        rules:
          - proto: tcp
            ports:
              - 80  # HTTP
              - 443  # HTTPS
              - 22  # SSH
              - 5986  # WinRM
              - 88  # Kerberos Authentication
              - 389  # LDAP
              - 3389  # RDP
              - 9090  # Cockpit
              - 9095  # Kafka EDA external listener (aws_kafka config drift)
              - 27199  # AAP receptor mesh (survives idempotent cloud stack redeploy)
            cidr_ip: 0.0.0.0/0
          - proto: icmp
            to_port: -1
            from_port: -1
            cidr_ip: 0.0.0.0/0
          - proto: tcp
            ports:
              - 80  # HTTP
              - 5986  # WinRM
              - 3389  # RDP
              - 53  # DNS
              - 135  # RPC
              - 139  # Netlogon
              - 389  # LDAP
              - 445  # SMB
              - 464  # Kerberos Authentication
              - 5432  # PostgreSQL
              - 636  # LDAPS (LDAP over TLS)
              - 873  # Rsync
              - 3268-3269  # Global Catalog
              - 1024-65535  # Ephemeral RPC ports
            cidr_ip: "{{ aws_vpc_cidr_block }}"
          - proto: udp
            ports:
              - 53  # DNS
              - 88  # Kerberos Authentication
              - 123  # NTP
              - 137-138  # Netlogon
              - 389  # LDAP
              - 445  # SMB
              - 464  # Kerberos Authentication
              - 1024-65535  # Ephemeral RPC ports
            cidr_ip: "{{ aws_vpc_cidr_block }}"
        rules_egress:
          - proto: -1
            cidr_ip: 0.0.0.0/0
        vpc_id: "{{ aws_vpc.vpc.id }}"
        tags:
          Name: "{{ aws_sg_name }}"
          owner: "{{ aws_owner_tag }}"
          purpose: "{{ aws_purpose_tag }}"

    - name: Create a subnet in the VPC
      amazon.aws.ec2_vpc_subnet:
        state: present
        vpc_id: "{{ aws_vpc.vpc.id }}"
        cidr: "{{ aws_subnet_cidr }}"
        region: "{{ create_vm_aws_region }}"
        az: "{{ _azs[create_vm_aws_region] | shuffle | first }}"
        map_public: true
        tags:
          Name: "{{ aws_subnet_name }}"
          owner: "{{ aws_owner_tag }}"
          purpose: "{{ aws_purpose_tag }}"
      register: aws_subnet

    # The owner tag can differ between Cloud Stack and Shared Services. Find
    # the table by its VPC and stable Name rather than by all mutable tags.
    - name: Find the demo subnet route tables
      amazon.aws.ec2_vpc_route_table_info:
        region: "{{ create_vm_aws_region }}"
        filters:
          vpc-id: "{{ aws_vpc.vpc.id }}"
          tag:Name: "{{ aws_rt_name }}"
      register: aws_named_route_tables

    - name: Select non-main route tables
      ansible.builtin.set_fact:
        aws_demo_route_tables: "{{ aws_demo_route_tables | default([]) + [item] }}"
      loop: "{{ aws_named_route_tables.route_tables }}"
      loop_control:
        label: "{{ item.id }}"
      when: item.associations | default([]) | selectattr('main', 'defined') | selectattr('main') | list | length == 0

    - name: Find a demo route table already associated with the subnet
      ansible.builtin.set_fact:
        aws_associated_route_tables: "{{ aws_associated_route_tables | default([]) + [item] }}"
      loop: "{{ aws_demo_route_tables | default([]) }}"
      loop_control:
        label: "{{ item.id }}"
      when: aws_subnet.subnet.id in (item.associations | default([]) | selectattr('subnet_id', 'defined') | map(attribute='subnet_id') | list)

    - name: Reject ambiguous demo route tables
      ansible.builtin.assert:
        that:
          - aws_associated_route_tables | default([]) | length <= 1
          - (aws_associated_route_tables | default([]) | length == 1) or (aws_demo_route_tables | default([]) | length <= 1)
        fail_msg: >-
          Multiple demo route tables exist and none is uniquely associated with
          the demo subnet. Inspect the tables and resolve the ambiguity before retrying.

    - name: Reject a matching main table when no reusable table exists
      ansible.builtin.assert:
        that:
          - (aws_demo_route_tables | default([]) | length > 0) or (aws_named_route_tables.route_tables | length == 0)
        fail_msg: >-
          A matching main route table exists but no non-main demo table is
          available. Inspect the VPC before retrying.

    - name: Select the demo route table to reuse
      ansible.builtin.set_fact:
        aws_reusable_route_table: >-
          {{ (aws_associated_route_tables | default([]) | first)
             if (aws_associated_route_tables | default([]) | length > 0)
             else (aws_demo_route_tables | default([]) | first | default({})) }}

    - name: Create or update the subnet route table
      amazon.aws.ec2_vpc_route_table:
        state: present
        vpc_id: "{{ aws_vpc.vpc.id }}"
        region: "{{ create_vm_aws_region }}"
        lookup: "{{ 'id' if aws_reusable_route_table.id is defined else 'tag' }}"
        route_table_id: "{{ aws_reusable_route_table.id | default(omit) }}"
        purge_subnets: false
        subnets:
          - "{{ aws_subnet.subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ aws_gateway.gateway_id }}"
        tags:
          Name: "{{ aws_rt_name }}"
          owner: "{{ aws_owner_tag }}"
          purpose: "{{ aws_purpose_tag }}"

    - name: Set VPC stats
      ansible.builtin.set_stats:
        data:
          stat_aws_region: '{{ create_vm_aws_region }}'
          stat_aws_vpc_id: '{{ aws_vpc.vpc.id }}'
          stat_aws_vpc_cidr: '{{ aws_vpc_cidr_block }}'
          stat_aws_subnet_id: '{{ aws_subnet.subnet.id }}'
          stat_aws_subnet_cidr: '{{ aws_subnet_cidr }}'
