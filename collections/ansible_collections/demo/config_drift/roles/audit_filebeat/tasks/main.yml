---
- name: Install audit package
  ansible.builtin.dnf:
    name: audit
    state: present
  when: ansible_os_family == 'RedHat'

- name: Ensure auditd is enabled and running
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true

- name: Deploy persistent audit watch rule
  ansible.builtin.template:
    src: sshd-config.rules.j2
    dest: "{{ config_drift_audit_rules_path }}"
    owner: root
    group: root
    mode: "0640"
  notify: Reload audit rules

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: false

- name: Verify watched file audit rule is active
  ansible.builtin.command: auditctl -l
  register: config_drift_auditctl_list
  changed_when: false

- name: Assert audit watch rule is loaded
  ansible.builtin.assert:
    that:
      - config_drift_audit_key in config_drift_auditctl_list.stdout
      - config_drift_watched_file in config_drift_auditctl_list.stdout
    fail_msg: >-
      Expected audit watch for {{ config_drift_watched_file }} with key
      {{ config_drift_audit_key }} was not found. Run: sudo auditctl -l

- name: Show active audit watches for watched file
  ansible.builtin.debug:
    msg: >-
      {{
        config_drift_auditctl_list.stdout_lines
        | select('search', config_drift_watched_file | basename)
        | list
      }}

- name: Configure Filebeat
  ansible.builtin.include_tasks: filebeat.yml
