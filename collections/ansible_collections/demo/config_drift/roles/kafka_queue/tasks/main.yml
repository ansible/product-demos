---
- name: Install Podman
  ansible.builtin.package:
    name: podman
    state: present

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Allow Kafka port from the demo VPC
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4" source address="{{ config_drift_kafka_vpc_cidr }}"
      port port="{{ config_drift_kafka_port }}" protocol="tcp" accept
    permanent: true
    state: enabled
    immediate: true
  when:
    - "'firewalld.service' in ansible_facts.services"
    - ansible_facts.services['firewalld.service'].state == 'running'

- name: Determine Kafka advertised listener address
  ansible.builtin.set_fact:
    config_drift_kafka_advertise_host: >-
      {{ kafka_private_ip | default(ansible_facts['default_ipv4']['address']) }}
    config_drift_kafka_external_advertise_host: >-
      {{ kafka_public_ip | default(ansible_facts['default_ipv4']['address']) }}

- name: Build Kafka listener configuration
  ansible.builtin.set_fact:
    config_drift_kafka_listeners: >-
      {{
        'PLAINTEXT://0.0.0.0:' ~ config_drift_kafka_port
        ~ ',PLAINTEXT_LOCAL://127.0.0.1:' ~ config_drift_kafka_local_port
        ~ (
          ',EXTERNAL://0.0.0.0:' ~ config_drift_kafka_external_port
          if kafka_public_ip is defined
          else ''
        )
        ~ ',CONTROLLER://127.0.0.1:9093'
      }}
    config_drift_kafka_advertised_listeners: >-
      {{
        'PLAINTEXT://' ~ config_drift_kafka_advertise_host ~ ':' ~ config_drift_kafka_port
        ~ ',PLAINTEXT_LOCAL://127.0.0.1:' ~ config_drift_kafka_local_port
        ~ (
          ',EXTERNAL://' ~ config_drift_kafka_external_advertise_host ~ ':' ~ config_drift_kafka_external_port
          if kafka_public_ip is defined
          else ''
        )
      }}
    config_drift_kafka_listener_security_protocol_map: >-
      {{
        'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_LOCAL:PLAINTEXT'
        ~ (',EXTERNAL:PLAINTEXT' if kafka_public_ip is defined else '')
      }}

- name: Allow external Kafka port from EDA consumers
  ansible.posix.firewalld:
    port: "{{ config_drift_kafka_external_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  when:
    - kafka_public_ip is defined
    - "'firewalld.service' in ansible_facts.services"
    - ansible_facts.services['firewalld.service'].state == 'running'

- name: List ephemeral containers sharing Kafka network namespace
  ansible.builtin.command:
    argv:
      - podman
      - ps
      - -aq
      - --filter
      - "network=container:{{ config_drift_kafka_container_name }}"
  register: config_drift_kafka_dependent_containers
  changed_when: false
  failed_when: false

- name: Remove ephemeral containers sharing Kafka network namespace
  ansible.builtin.command:
    argv:
      - podman
      - rm
      - -f
      - "{{ item }}"
  loop: "{{ config_drift_kafka_dependent_containers.stdout_lines }}"
  when: config_drift_kafka_dependent_containers.stdout_lines | length > 0
  changed_when: true

- name: Remove existing Kafka broker container before listener updates
  containers.podman.podman_container:
    name: "{{ config_drift_kafka_container_name }}"
    state: absent
  failed_when: false

- name: Run single-node KRaft Kafka broker
  containers.podman.podman_container:
    name: "{{ config_drift_kafka_container_name }}"
    image: "{{ config_drift_kafka_image }}"
    state: started
    restart_policy: always
    ports: "{{ [config_drift_kafka_port ~ ':' ~ config_drift_kafka_port] + ([config_drift_kafka_external_port ~ ':' ~ config_drift_kafka_external_port] if kafka_public_ip is defined else []) }}"
    env:
      CLUSTER_ID: "{{ config_drift_kafka_cluster_id }}"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "{{ config_drift_kafka_listeners }}"
      KAFKA_ADVERTISED_LISTENERS: "{{ config_drift_kafka_advertised_listeners }}"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "{{ config_drift_kafka_listener_security_protocol_map }}"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_HEAP_OPTS: "{{ config_drift_kafka_broker_heap_opts }}"

- name: Wait for Kafka broker port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ config_drift_kafka_port }}"
    timeout: 180

- name: Wait for Kafka broker to accept admin requests
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --network
      - "container:{{ config_drift_kafka_container_name }}"
      - -e
      - "KAFKA_HEAP_OPTS={{ config_drift_kafka_admin_heap_opts }}"
      - "{{ config_drift_kafka_image }}"
      - /opt/kafka/bin/kafka-broker-api-versions.sh
      - --bootstrap-server
      - "127.0.0.1:{{ config_drift_kafka_local_port }}"
  register: config_drift_kafka_ready
  until: config_drift_kafka_ready.rc == 0
  retries: 24
  delay: 5
  changed_when: false

- name: Create linux-audit-events topic
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --network
      - "container:{{ config_drift_kafka_container_name }}"
      - -e
      - "KAFKA_HEAP_OPTS={{ config_drift_kafka_admin_heap_opts }}"
      - "{{ config_drift_kafka_image }}"
      - /opt/kafka/bin/kafka-topics.sh
      - --create
      - --if-not-exists
      - --topic
      - "{{ config_drift_kafka_topic }}"
      - --bootstrap-server
      - "127.0.0.1:{{ config_drift_kafka_local_port }}"
      - --partitions
      - "1"
      - --replication-factor
      - "1"
  register: config_drift_kafka_topic_create
  until: config_drift_kafka_topic_create.rc == 0
  retries: 6
  delay: 10
  changed_when: "'Created topic' in (config_drift_kafka_topic_create.stdout | default(''))"

- name: List Kafka topics
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --network
      - "container:{{ config_drift_kafka_container_name }}"
      - -e
      - "KAFKA_HEAP_OPTS={{ config_drift_kafka_admin_heap_opts }}"
      - "{{ config_drift_kafka_image }}"
      - /opt/kafka/bin/kafka-topics.sh
      - --list
      - --bootstrap-server
      - "127.0.0.1:{{ config_drift_kafka_local_port }}"
  register: config_drift_kafka_topic_list
  changed_when: false

- name: Show Kafka broker details
  ansible.builtin.debug:
    msg:
      - "Kafka broker listening on {{ config_drift_kafka_advertise_host }}:{{ config_drift_kafka_port }}"
      - >-
        External listener:
        {{ config_drift_kafka_external_advertise_host }}:{{ config_drift_kafka_external_port }}
        {{ '(EDA)' if kafka_public_ip is defined else '(not configured)' }}
      - "Topic: {{ config_drift_kafka_topic }}"
      - "Topics: {{ config_drift_kafka_topic_list.stdout_lines }}"

- name: Deploy presenter event dashboard
  ansible.builtin.include_tasks: dashboard.yml
