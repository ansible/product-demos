---
# AWS infrastructure
clab_aws_region: us-east-2
clab_aws_instance_type: c8i.4xlarge
clab_aws_image_filter: 'RHEL-9*HVM-*Hourly*'
clab_aws_image_owners: "309956199498"
clab_aws_image_architecture: x86_64
clab_aws_ebs_size_gb: 100
clab_aws_ebs_device: /dev/sdf
clab_aws_ebs_nvme_device: /dev/nvme0n1
clab_aws_ebs_mount: /mnt/images
clab_aws_vpc_name: clab-vpc
clab_aws_vpc_cidr: "10.0.0.0/16"
clab_aws_subnet_name: clab-subnet
clab_aws_subnet_cidr: "10.0.1.0/24"
clab_aws_sg_name: clab-sg
clab_aws_keypair_name: clab-key
clab_aws_rt_name: clab-rt
clab_aws_admin_user: ec2-user
clab_aws_owner_tag: apd-demo
clab_aws_purpose_tag: containerlab

_azs:
  us-east-2:
    - us-east-2a
    - us-east-2b
    - us-east-2c
  us-west-2:
    - us-west-2a
    - us-west-2b
    - us-west-2c

# Podman / image configuration
clab_podman_image_path: /mnt/images
clab_podman_user_storage_content: |
  [storage]
  driver = "overlay"
  graphroot = "/mnt/images/storage"
clab_images: "{{ clab_devices.values() | map(attribute='image') | unique | list }}"

# Containerlab topology
clab_topology: product_demos
clab_root_dir: /root/clab
clab_device_username: admin
# Multi-vendor bootstrap credentials must match Containerlab Device Access.
# The restored product_demos startup files retain admin / admin@123 from main.
clab_device_password: "{{ lookup('ansible.builtin.env', 'CLAB_DEVICE_PASSWORD') | default('admin@123', true) }}"
clab_report_port: 8088
clab_access_cidr: 0.0.0.0/0
clab_security_group_rules:
  - proto: tcp
    ports: "{{ ([22, clab_report_port | int] + (clab_devices.values() | map(attribute='port') | list) + (clab_devices.values() | map(attribute='ssh_port') | list)) | unique | list }}"
    cidr_ip: "{{ clab_access_cidr }}"
  - proto: icmp
    from_port: -1
    to_port: -1
    cidr_ip: "{{ clab_access_cidr }}"
# Catalog shared by topology selection and Controller inventory setup.
clab_devices: "{{ clab_device_catalog | dict2items | selectattr('key', 'in', clab_topologies[clab_topology].devices) | items2dict }}"
clab_links: "{{ clab_topologies[clab_topology].links }}"
clab_topologies:
  product_demos:
    devices: [n9kv, cat8kv]
    links: []
  multi-vendor:
    devices: [n9kv, cat8kv, vjunos, veos]
    links:
      - endpoints: [cat8kv:Gi2, n9kv:eth1]
      - endpoints: [n9kv:eth2, vjunos:ge-0/0/0]
      - endpoints: [vjunos:ge-0/0/1, veos:eth1]
clab_device_catalog:
  n9kv:
    kind: cisco_n9kv
    image: registry.gitlab.com/redhatautomation/nexus10-ee:10.5.3.F
    group: clab_nxos
    network_os: cisco.nxos.nxos
    connection: ansible.netcommon.network_cli
    ssh_port: 2122
    port: 2122
    timeout: 900
  cat8kv:
    kind: cisco_c8000v
    image: registry.gitlab.com/redhatautomation/cat8:17.13.01a
    group: clab_ios
    network_os: cisco.ios.ios
    connection: ansible.netcommon.network_cli
    ssh_port: 2123
    port: 2123
    timeout: 900
  vjunos:
    kind: juniper_vjunosswitch
    image: registry.gitlab.com/redhatautomation/vjunos_switch_clab:25.2R1.9
    group: clab_junos
    network_os: juniper.device.junos
    connection: ansible.netcommon.netconf
    ssh_port: 2124
    port: 2830
    timeout: 1800
  veos:
    kind: arista_veos
    image: registry.gitlab.com/redhatautomation/veos-ee:4.32.0F
    # EC2 nested KVM rejects the performance-capabilities MSR exposed by host.
    env:
      QEMU_CPU: host,level=9,pdcm=off
    group: clab_eos
    network_os: arista.eos.eos
    connection: ansible.netcommon.network_cli
    ssh_port: 2125
    port: 2125
    timeout: 900
