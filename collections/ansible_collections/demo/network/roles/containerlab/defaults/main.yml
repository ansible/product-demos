---
# AWS infrastructure
clab_aws_region: us-east-2
clab_aws_instance_type: c8i.4xlarge
clab_aws_image_filter: 'RHEL-9*HVM-*Hourly*'
clab_aws_image_owners: "309956199498"
clab_aws_image_architecture: x86_64
clab_aws_ebs_size_gb: 100
clab_aws_ebs_device: /dev/sdf
clab_aws_ebs_nvme_device: /dev/nvme0n1
clab_aws_ebs_mount: /mnt/images
clab_aws_vpc_name: clab-vpc
clab_aws_vpc_cidr: "10.0.0.0/16"
clab_aws_subnet_name: clab-subnet
clab_aws_subnet_cidr: "10.0.1.0/24"
clab_aws_sg_name: clab-sg
clab_aws_keypair_name: clab-key
clab_aws_rt_name: clab-rt
clab_aws_admin_user: ec2-user
clab_aws_owner_tag: apd-demo
clab_aws_purpose_tag: containerlab

_azs:
  us-east-2:
    - us-east-2a
    - us-east-2b
    - us-east-2c
  us-west-2:
    - us-west-2a
    - us-west-2b
    - us-west-2c

# Podman / image configuration
clab_podman_image_path: /mnt/images
clab_podman_user_storage_content: |
  [storage]
  driver = "overlay"
  graphroot = "/mnt/images/storage"
clab_images: "{{ clab_devices.values() | map(attribute='image') | unique | list }}"

# Connected Product Demos topology
clab_topology: product_demos
clab_root_dir: /root/clab
clab_device_username: admin
# Match the Containerlab Device Access credential.
clab_device_password: "{{ lookup('ansible.builtin.env', 'CLAB_DEVICE_PASSWORD') | default('admin@123', true) }}"
clab_report_port: 8088
clab_access_cidr: 0.0.0.0/0
clab_security_group_rules:
  - proto: tcp
    ports: "{{ ([22, clab_report_port | int] + (clab_devices.values() | map(attribute='port') | list) + (clab_devices.values() | map(attribute='ssh_port') | list)) | unique | list }}"
    cidr_ip: "{{ clab_access_cidr }}"
  - proto: icmp
    from_port: -1
    to_port: -1
    cidr_ip: "{{ clab_access_cidr }}"
clab_devices: "{{ clab_device_catalog }}"
# Previous split deployments are accepted only for migration and cleanup.
clab_legacy_topology_names: [multi-vendor]
clab_retired_devices: [n9kv, cat8kv, vjunos, veos]
clab_active_topologies: []
clab_active_devices: "{{ clab_devices if clab_topology in clab_active_topologies else {} }}"
clab_destroy_required: false
clab_links:
  - endpoints: [cat8kv1:Gi2, veos2:eth1]
  - endpoints: [cat8kv1:Gi3, vjunos3:ge-0/0/0]
  - endpoints: [veos4:eth1, veos2:eth2]
clab_device_catalog:
  cat8kv1:
    kind: cisco_c8000v
    image: registry.gitlab.com/redhatautomation/cat8:17.13.01a
    startup_config: configs/cat8kv/startup-config.cfg
    mgmt_ipv4: 172.20.20.12
    group: clab_ios
    network_os: cisco.ios.ios
    connection: ansible.netcommon.network_cli
    ssh_port: 2123
    port: 2123
    timeout: 900
  veos2:
    kind: arista_veos
    image: registry.gitlab.com/redhatautomation/veos-ee:4.32.0F
    startup_config: configs/veos2/startup-config.cfg
    mgmt_ipv4: 172.20.20.13
    env:
      QEMU_CPU: IvyBridge
      QEMU_ADDITIONAL_ARGS: '-cpu IvyBridge,check=off'
    group: clab_eos
    network_os: arista.eos.eos
    connection: ansible.netcommon.network_cli
    ssh_port: 2124
    port: 2124
    timeout: 900
  vjunos3:
    kind: juniper_vsrx
    image: registry.gitlab.com/redhatautomation/juniper-ee:23.2R2.21
    startup_config: configs/vjunos3/startup-config.cfg
    mgmt_ipv4: 172.20.20.14
    group: clab_junos
    network_os: juniper.device.junos
    connection: ansible.netcommon.netconf
    ssh_port: 2125
    port: 2225
    timeout: 1800
  veos4:
    kind: arista_veos
    image: registry.gitlab.com/redhatautomation/veos-ee:4.32.0F
    startup_config: configs/veos4/startup-config.cfg
    mgmt_ipv4: 172.20.20.15
    env:
      QEMU_CPU: IvyBridge
      QEMU_ADDITIONAL_ARGS: '-cpu IvyBridge,check=off'
    group: clab_eos
    network_os: arista.eos.eos
    connection: ansible.netcommon.network_cli
    ssh_port: 2126
    port: 2126
    timeout: 900
