---
- name: Validate device credentials for startup configuration
  ansible.builtin.assert:
    that:
      - clab_device_username is match('^[a-zA-Z][a-zA-Z0-9_-]*$')
      - clab_device_password is match('^[A-Za-z0-9!@#%^*()_+=.,:-]+$')
    fail_msg: Device credentials must use a simple username and a nonempty password without whitespace or quotes.
  no_log: true

- name: Generate password hash for EOS and Junos bootstrap
  ansible.builtin.set_fact:
    # EOS requires the standard $6$salt$hash form, without a rounds= prefix.
    clab_device_password_hash: "{{ clab_device_password | password_hash('sha512', rounds=5000) }}"
  no_log: true
  when: clab_topology == 'multi-vendor'

- name: Create startup configuration directories
  ansible.builtin.file:
    path: "{{ clab_root_dir }}/{{ clab_topology }}/configs/{{ item }}"
    state: directory
    mode: '0700'
  loop: "{{ clab_devices.keys() | list }}"

- name: Render device bootstrap configuration
  ansible.builtin.template:
    src: "{{ clab_files_path }}/{{ clab_topology }}/configs/{{ item }}/startup-config.cfg"
    dest: "{{ clab_root_dir }}/{{ clab_topology }}/configs/{{ item }}/startup-config.cfg"
    mode: '0600'
  loop: "{{ clab_devices.keys() | list }}"
  no_log: true
  when: clab_topology == 'multi-vendor'

- name: Restore original Product Demos topology
  ansible.builtin.copy:
    src: "{{ clab_files_path }}/product_demos/"
    dest: "{{ clab_root_dir }}/product_demos/"
    mode: preserve
  when: clab_topology == 'product_demos'

- name: Render topology from device catalog
  ansible.builtin.template:
    src: "{{ role_path }}/templates/multi-vendor.clab.yml.j2"
    dest: "{{ clab_root_dir }}/{{ clab_topology }}/{{ clab_topology }}.clab.yml"
    mode: '0644'
  when: clab_topology == 'multi-vendor'
