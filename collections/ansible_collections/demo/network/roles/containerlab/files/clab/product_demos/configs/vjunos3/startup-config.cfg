system {
    host-name vjunos3;
    root-authentication {
        encrypted-password "{{ clab_device_password_hash }}";
    }
    login {
        user {{ clab_device_username }} {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "{{ clab_device_password_hash }}";
            }
        }
    }
    services {
        ssh;
        netconf { ssh { port 830; } }
    }
    management-instance;
}
interfaces {
    ge-0/0/0 { unit 0 { family inet; } }
    lo0 { unit 0 { family inet; } }
}
security {
    zones {
        security-zone trust {
            host-inbound-traffic { system-services { ping; } }
            interfaces { ge-0/0/0.0; lo0.0; }
        }
    }
}
routing-instances {
    mgmt_junos {
        routing-options { static { route 0.0.0.0/0 next-hop 10.0.0.2; } }
    }
}
