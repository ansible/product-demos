system {
    host-name vjunos;
    root-authentication {
        encrypted-password "{{ clab_device_password_hash }}";
    }
    login {
        user {{ clab_device_username }} {
            class super-user;
            authentication {
                encrypted-password "{{ clab_device_password_hash }}";
            }
        }
    }
    services {
        ssh;
        netconf { ssh; }
    }
}
