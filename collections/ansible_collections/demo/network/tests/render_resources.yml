---
- name: Render every planned resource with current Hub modules without devices
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../roles/configure_lab/defaults/main.yml
  tasks:
    - name: Render vendor resources
      ansible.builtin.include_tasks: tasks/render_platform.yml
      loop:
        - {host: cat8kv1, os: cisco.ios.ios}
        - {host: veos2, os: arista.eos.eos}
        - {host: vjunos3, os: juniper.device.junos}
        - {host: veos4, os: arista.eos.eos}
      loop_control:
        loop_var: platform
