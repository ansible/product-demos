---
- name: Verify independent Containerlab deployments on the live hypervisor
  hosts: "{{ _report_server | default('clab_containerlab') }}"
  become: true
  gather_facts: false
  vars:
    clab_expected_topologies: [product_demos, multi-vendor]
    clab_preserved_containers: {}
    clab_inspect_format: !unsafe '{{.Name}}|{{.Id}}|{{.State.StartedAt}}|{{.State.Status}}'
  roles:
    - role: demo.network.containerlab
  tasks:
    - name: Read the deployed topology record
      ansible.builtin.include_role:
        name: demo.network.containerlab
        tasks_from: discover_active

    - name: Require the expected labs to remain deployed
      ansible.builtin.assert:
        that:
          - clab_active_topologies | sort == clab_expected_topologies | sort

    - name: List lab containers
      ansible.builtin.command:
        argv:
          - podman
          - ps
          - --all
          - --format
          - "{{ '{{' }}.Names{{ '}}' }}"
      register: clab_runtime_names
      changed_when: false

    - name: Inspect container identity and start time
      ansible.builtin.command:
        argv: "{{ ['podman', 'inspect', '--format', clab_inspect_format] + (clab_runtime_names.stdout_lines | select('match', '^clab-(product_demos|multi-vendor)-') | list) }}"
      register: clab_runtime_inspect
      changed_when: false

    - name: Initialize runtime snapshot
      ansible.builtin.set_fact:
        clab_runtime_snapshot: {}

    - name: Build runtime snapshot
      ansible.builtin.set_fact:
        clab_runtime_snapshot: "{{ clab_runtime_snapshot | combine({item.split('|')[0]: {'id': item.split('|')[1], 'started_at': item.split('|')[2], 'status': item.split('|')[3]}}) }}"
      loop: "{{ clab_runtime_inspect.stdout_lines }}"

    - name: Require each selected device container to be running
      ansible.builtin.assert:
        that:
          - clab_runtime_snapshot['clab-' + item.0.key + '-' + item.1].status == 'running'
      loop: "{{ (clab_topologies | dict2items | selectattr('key', 'in', clab_expected_topologies) | list) | subelements('value.devices') }}"
      loop_control:
        label: "{{ item.0.key }} / {{ item.1 }}"

    - name: Require no duplicate or unexpected device containers
      ansible.builtin.assert:
        that:
          - clab_runtime_snapshot | length == (clab_expected_topologies | map('extract', clab_topologies) | map(attribute='devices') | flatten | length) + (1 if 'product_demos' in clab_expected_topologies else 0)

    - name: Require containers from the other lab to retain identity and start time
      ansible.builtin.assert:
        that:
          - clab_runtime_snapshot[item.key].id == item.value.id
          - clab_runtime_snapshot[item.key].started_at == item.value.started_at
      loop: "{{ clab_preserved_containers | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Verify all deployed device management services
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item.value.port }}"
        search_regex: SSH
        timeout: 30
      loop: "{{ clab_active_devices | dict2items }}"
      loop_control:
        label: "{{ item.key }}:{{ item.value.port }}"

    - name: Export coexistence validation evidence
      ansible.builtin.set_stats:
        data:
          clab_topologies: "{{ clab_active_topologies }}"
          clab_containers: "{{ clab_runtime_snapshot }}"
          clab_device_count: "{{ clab_active_devices | length }}"
        per_host: false
