---
- name: Validate independent topologies and deployment discovery without a hypervisor
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    clab_device_password: offline-test-password
  roles:
    - role: demo.network.containerlab
  tasks:
    - name: Create temporary lab workspace
      ansible.builtin.tempfile:
        state: directory
        prefix: clab-topology-test-
      register: clab_test_workspace

    - name: Exercise topology rendering and discovery
      vars:
        clab_root_dir: "{{ clab_test_workspace.path }}"
      block:
        - name: Discover an empty workspace
          ansible.builtin.include_role:
            name: demo.network.containerlab
            tasks_from: discover_active

        - name: Require no active topology before deployment
          ansible.builtin.assert:
            that: clab_active_topologies == []

        - name: Render and validate each supported topology
          ansible.builtin.include_tasks: tasks/render_topology.yml
          loop: [product_demos, multi-vendor, product_demos]
          loop_control:
            loop_var: clab_test_topology_name
            index_var: clab_test_topology_index
          vars:
            clab_topology: "{{ clab_test_topology_name }}"

        - name: Mark the lab as torn down while retaining old topology files
          ansible.builtin.copy:
            dest: "{{ clab_root_dir }}/active_topology"
            content: ""
            mode: '0644'

        - name: Discover a torn down lab
          ansible.builtin.include_role:
            name: demo.network.containerlab
            tasks_from: discover_active

        - name: Require teardown record to take precedence over legacy files
          ansible.builtin.assert:
            that: clab_active_topologies == []
      always:
        - name: Remove temporary lab workspace
          ansible.builtin.file:
            path: "{{ clab_test_workspace.path }}"
            state: absent
