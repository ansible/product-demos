---

- block:

    # we use configmap by default for windows sysprep
    # this step is only needed when using iso file upload
    - include_tasks: check_upload_url.yml
      when: not kubevirt_use_configmap|bool

    - include_tasks: provision_vm.yml
      loop: "{{ nodes }}"
      loop_control:
        loop_var: template
      when: nodes is defined

    - name: start the vm(s)
      kubernetes.core.k8s:
        state: present
        merge_type: merge
        validate_certs: no
        api_key: "{{ api_key }}"
        definition:
          apiVersion: "{{ api_version_virtual_machine }}"
          kind: VirtualMachine
          metadata:
            name: '{{ template.name }}'
            namespace: '{{ target_namespace }}'
          spec:
            runStrategy: Always
            running: null
      loop: "{{ nodes }}"
      loop_control:
        loop_var: template
      when: nodes is defined

#    - name: start the vm(s)
#      kubevirt_vm:
#        state: running
#        name: '{{ template.name }}'
#        namespace: '{{ target_namespace }}'
#        wait: no
#        validate_certs: no
#        api_key: "{{ api_key }}"
#      loop: "{{ nodes }}"
#      loop_control:
#        loop_var: template
#      when: nodes is defined

    - include_tasks: wait_disk.yml
      loop: '{{ nodes }}'
      loop_control:
        loop_var: template
      when: nodes is defined

    - include_tasks: wait_for_remote.yml
      loop: "{{ nodes }}"
      loop_control:
        loop_var: template
      when:
        - nodes is defined

    - include_tasks: detach_cdroms.yml
      loop: "{{ nodes }}"
      loop_control:
        loop_var: template
      when:
        - nodes is defined
        - vm_os_type == 'windows'
        - template.sysprep is undefined or (template.sysprep is defined and template.sysprep|bool)

  rescue:

    - name: set vm_failed variable
      set_fact:
        vm_failed: yes

  always:

    - include_tasks: datastore_iso_remove.yml
      loop: "{{ nodes }}"
      loop_control:
        loop_var: template
      when: nodes is defined

    - name: remove temporary directory
      file:
        path: "{{ temp_directory }}"
        state: absent

- name: fail if needed
  fail:
    msg: "fail to provision vm(s)"
  when: vm_failed|bool