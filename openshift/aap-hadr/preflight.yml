---
- name: Preflight AAP HA/DR OpenShift sites
  hosts: localhost
  gather_facts: false
  vars:
    aap_hadr_required_contexts:
      - "{{ aap_hadr_primary_context }}"
      - "{{ aap_hadr_standby_context }}"
    aap_hadr_required_operator_crds:
      - ansibleautomationplatforms.aap.ansible.com
      - clusters.postgresql.cnpg.io
      - externalsecrets.external-secrets.io
  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - aap_hadr_namespace | length > 0
          - aap_hadr_primary_context | length > 0
          - aap_hadr_standby_context | length > 0
          - aap_hadr_primary_context != aap_hadr_standby_context
        fail_msg: >-
          Provide distinct OpenShift contexts and a non-empty AAP namespace.

    - name: Query OpenShift ClusterVersion on both sites
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: ClusterVersion
        name: version
        context: "{{ item }}"
      loop: "{{ aap_hadr_required_contexts }}"
      register: aap_hadr_cluster_versions
      changed_when: false

    - name: Verify both sites are OpenShift 4.14 or newer
      ansible.builtin.assert:
        that:
          - item.resources | length == 1
          - item.resources[0].status.desired.version is version('4.14', '>=')
        fail_msg: >-
          {{ item.item }} does not meet the OpenShift 4.14+ baseline
          (found {{ item.resources[0].status.desired.version | default('unknown') }}).
      loop: "{{ aap_hadr_cluster_versions.results }}"

    - name: Verify AAP namespace exists on both sites
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: "{{ aap_hadr_namespace }}"
        context: "{{ item }}"
      loop: "{{ aap_hadr_required_contexts }}"
      register: aap_hadr_namespaces
      changed_when: false

    - name: Require the AAP namespace on both sites
      ansible.builtin.assert:
        that:
          - item.resources | length == 1
        fail_msg: "Namespace {{ aap_hadr_namespace }} is missing on {{ item.item }}."
      loop: "{{ aap_hadr_namespaces.results }}"

    - name: Query required operator CRDs on both sites
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item.1 }}"
        context: "{{ item.0 }}"
      loop: "{{ aap_hadr_required_contexts | product(aap_hadr_required_operator_crds) | list }}"
      loop_control:
        label: "{{ item.0 }} / {{ item.1 }}"
      register: aap_hadr_operator_crds
      changed_when: false

    - name: Require AAP, CNPG, and External Secrets CRDs on both sites
      ansible.builtin.assert:
        that:
          - item.resources | length == 1
        fail_msg: "Required CRD {{ item.item.1 }} is missing on {{ item.item.0 }}."
      loop: "{{ aap_hadr_operator_crds.results }}"

    - name: Check required API resources exist
      kubernetes.core.k8s_info:
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        namespace: "{{ aap_hadr_namespace }}"
        context: "{{ item.context }}"
      loop:
        - api_version: aap.ansible.com/v1alpha1
          kind: AnsibleAutomationPlatform
          context: "{{ aap_hadr_primary_context }}"
        - api_version: aap.ansible.com/v1alpha1
          kind: AnsibleAutomationPlatform
          context: "{{ aap_hadr_standby_context }}"
        - api_version: postgresql.cnpg.io/v1
          kind: Cluster
          context: "{{ aap_hadr_primary_context }}"
        - api_version: postgresql.cnpg.io/v1
          kind: Cluster
          context: "{{ aap_hadr_standby_context }}"
      register: aap_hadr_resources
      changed_when: false

    - name: Require AAP and CNPG resources
      ansible.builtin.assert:
        that:
          - item.resources | length > 0
        fail_msg: "{{ item.item.kind }} is missing on {{ item.item.context }}."
      loop: "{{ aap_hadr_resources.results }}"
