---
controller_inventories:
  - name: Ansible Product Demos Windows Inventory
    organization: Ansible Product Demos (APD)

controller_credentials:
  - name: OpenShift Credential
    organization: Ansible Product Demos (APD)
    credential_type: OpenShift or Kubernetes API Bearer Token
    update_secrets: false
    state: exists
    inputs:
      host: CHANGEME
      bearer_token: CHANGEME
      verify_ssl: false

controller_inventory_sources:
  - name: OpenShift CNV Inventory
    inventory: Ansible Product Demos Inventory
    source: scm
    source_project: Ansible Product Demos
    source_path: openshift/inventory.kubevirt.yml
    credential: OpenShift Credential
    update_on_launch: false
    overwrite: true
  - name: OpenShift Windows CNV Inventory
    inventory: Ansible Product Demos Windows Inventory
    source: scm
    source_project: Ansible Product Demos
    source_path: openshift/inventory.windows.kubevirt.yml
    credential: OpenShift Credential
    update_on_launch: false
    overwrite: true

controller_execution_environments:
  - name: Ansible BSOD Recovery EE
    image: quay.io/ansible-product-demos/apd-ee-26:latest

controller_templates:
  - name: OpenShift | EDA | Install Controller
    job_type: run
    inventory: Ansible Product Demos Inventory
    project: "Ansible Product Demos"
    playbook: "openshift/eda/install.yml"
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    credentials:
      - OpenShift Credential
      - AAP Credential

  - name: OpenShift | CNV | Install Operator
    job_type: run
    inventory: Ansible Product Demos Inventory
    project: "Ansible Product Demos"
    playbook: "openshift/cnv/install.yml"
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    credentials:
      - OpenShift Credential

  - name: OpenShift | CNV | Create RHEL VM
    job_type: run
    inventory: Ansible Product Demos Inventory
    project: "Ansible Product Demos"
    playbook: "openshift/cnv/provision_rhel.yml"
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    allow_simultaneous: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: VM name
          type: text
          variable: vm_name
          default: rhel9
          required: true
        - question_name: VM NameSpace
          type: text
          variable: vm_namespace
          default: openshift-cnv
          required: true
        - question_name: SSH Authorized Key
          type: textarea
          variable: ssh_authorized_key
          required: true
        - question_name: OS Version
          type: text
          variable: os_version
          default: rhel9
          required: true
        - question_name: RHEL Activation Key
          type: text
          variable: rh_subscription_key
          required: true
        - question_name: RHEL Organization ID
          type: text
          variable: rh_subscription_org
          required: true
    credentials:
      - OpenShift Credential

  - name: OpenShift | CNV | Create VM Snapshots
    job_type: run
    inventory: Ansible Product Demos Inventory
    project: "Ansible Product Demos"
    playbook: "openshift/cnv/snapshot.yml"
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    extra_vars:
      snapshot_operation: create
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Server Name or Pattern
          type: text
          variable: _hosts
          default: "openshift-cnv-rhel*"
          required: true
        - question_name: VM NameSpace
          type: text
          variable: vm_namespace
          default: openshift-cnv
          required: true
    credentials:
      - OpenShift Credential

  - name: OpenShift | CNV | Restore Latest VM Snapshots
    job_type: run
    inventory: Ansible Product Demos Inventory
    project: "Ansible Product Demos"
    playbook: "openshift/cnv/snapshot.yml"
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    extra_vars:
      snapshot_operation: restore
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Server Name or Pattern
          type: text
          variable: _hosts
          default: "openshift-cnv-rhel*"
          required: true
        - question_name: VM NameSpace
          type: text
          variable: vm_namespace
          default: openshift-cnv
          required: true
    credentials:
      - OpenShift Credential

  - name: OpenShift | CNV | Delete VM
    job_type: run
    inventory: Ansible Product Demos Inventory
    project: "Ansible Product Demos"
    playbook: "openshift/cnv/delete.yml"
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    extra_vars:
      instance_state: absent
    survey:
      name: ''
      description: ''
      spec:
        - question_name: VM host string
          type: text
          variable: vm_host_string
          required: true
        - question_name: VM NameSpace
          type: text
          variable: vm_namespace
          default: openshift-cnv
          required: true

    credentials:
      - OpenShift Credential

  - name: OpenShift | CNV | Patch
    job_type: check
    inventory: Ansible Product Demos Inventory
    project: "Ansible Product Demos"
    playbook: "openshift/cnv/patch.yml"
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    ask_job_type_on_launch: true
    credentials:
      - OpenShift Credential
      - APD Machine Credential
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Server Name or Pattern
          type: text
          variable: _hosts
          default: "openshift-cnv-rhel*"
          required: true

  - name: OpenShift | CNV | Wait Hosts
    inventory: Ansible Product Demos Inventory
    project: "Ansible Product Demos"
    playbook: "openshift/cnv/wait.yml"
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Wait hosts
          type: text
          variable: _hosts
          default: "openshift-cnv-rhel*"
          required: true

  - name: OpenShift | Dev Spaces
    job_type: run
    inventory: Ansible Product Demos Inventory
    project: "Ansible Product Demos"
    playbook: "openshift/devspaces.yml"
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    credentials:
      - OpenShift Credential

  - name: OpenShift | GitLab
    job_type: run
    inventory: Ansible Product Demos Inventory
    project: "Ansible Product Demos"
    playbook: "openshift/gitlab.yml"
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    credentials:
      - OpenShift Credential

  - name: OpenShift | Vault
    job_type: run
    inventory: Ansible Product Demos Inventory
    project: "Ansible Product Demos"
    playbook: "openshift/vault.yml"
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Operation
          type: multiplechoice
          variable: vault_operation
          required: true
          default: install
          choices:
            - install
            - uninstall
    credentials:
      - OpenShift Credential
      - AAP Credential

  - name: OpenShift | Windows | Provision Infrastructure
    description: Provisions Windows Server VMs on OpenShift Virtualization for the BSOD recovery demo.
    job_type: run
    inventory: Ansible Product Demos Windows Inventory
    project: "Ansible Product Demos"
    playbook: openshift/windows-bsod-recovery/provision_infra_multi.yml
    execution_environment: Ansible BSOD Recovery EE
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    extra_vars:
      provider: kubevirt
      scenario: winpe
      infra_template_name: windows-2022-standard
      pvc_storage_class: ocs-external-storagecluster-ceph-rbd
      kubevirt_controller_in_cluster: true
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credential
      - APD Machine Credential

  - name: OpenShift | Windows | Remove Infrastructure
    description: Removes Windows VMs provisioned for the BSOD recovery demo.
    job_type: run
    inventory: Ansible Product Demos Windows Inventory
    project: "Ansible Product Demos"
    playbook: openshift/windows-bsod-recovery/remove_infra_multi.yml
    execution_environment: Ansible BSOD Recovery EE
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    extra_vars:
      provider: kubevirt
      scenario: winpe
      pvc_storage_class: ocs-external-storagecluster-ceph-rbd
      kubevirt_controller_in_cluster: true
    ask_limit_on_launch: true
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credential
      - APD Machine Credential

  - name: OpenShift | Windows | Generate WinPE
    description: Generates a WinPE recovery ISO on a provisioned Windows system.
    job_type: run
    inventory: Ansible Product Demos Windows Inventory
    project: "Ansible Product Demos"
    playbook: openshift/windows-bsod-recovery/generate_winpe.yml
    execution_environment: Ansible BSOD Recovery EE
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    extra_vars:
      create_winpe_destination_file_location: iso_upload
      create_winpe_enable_autostart: true
      create_winpe_enable_powershell_modules: false
      create_winpe_enable_script_debug: false
      create_winpe_load_drivers: true
    ask_limit_on_launch: true
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credential
      - APD Machine Credential

  - name: OpenShift | Windows | Upload WinPE ISO
    description: Uploads the generated WinPE ISO to OpenShift Virtualization.
    job_type: run
    inventory: Ansible Product Demos Windows Inventory
    project: "Ansible Product Demos"
    playbook: openshift/windows-bsod-recovery/upload_winpe_iso.yml
    execution_environment: Ansible BSOD Recovery EE
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    extra_vars:
      provider: kubevirt
      kubevirt_upload_pvc_storage_class: ocs-external-storagecluster-ceph-rbd
      kubevirt_upload_pvc_access_mode: ReadWriteMany
      kubevirt_upload_pvc_volume_mode: Block
    ask_limit_on_launch: true
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credential
      - APD Machine Credential

  - name: OpenShift | Windows | Produce BSOD
    description: Triggers a simulated Blue Screen of Death on Windows VMs in OpenShift Virtualization.
    job_type: run
    inventory: Ansible Product Demos Windows Inventory
    project: "Ansible Product Demos"
    playbook: openshift/windows-bsod-recovery/produce_bsod.yml
    execution_environment: Ansible BSOD Recovery EE
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    ask_limit_on_launch: true
    ask_variables_on_launch: true
    credentials:
      - APD Machine Credential

  - name: OpenShift | Windows | Recover from BSOD
    description: Boots a BSOD-affected VM into WinPE and applies the recovery fix.
    job_type: run
    inventory: Ansible Product Demos Windows Inventory
    project: "Ansible Product Demos"
    playbook: openshift/windows-bsod-recovery/execute_winpe_recovery.yml
    execution_environment: Ansible BSOD Recovery EE
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    extra_vars:
      provider: kubevirt
      scenario: bsod_fix
    ask_limit_on_launch: true
    ask_variables_on_launch: true
    credentials:
      - OpenShift Credential
      - APD Machine Credential

  - name: OpenShift | Windows | Check System
    description: Verifies that a Windows system is healthy after BSOD recovery.
    job_type: run
    inventory: Ansible Product Demos Windows Inventory
    project: "Ansible Product Demos"
    playbook: openshift/windows-bsod-recovery/check_system.yml
    execution_environment: Ansible BSOD Recovery EE
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    ask_limit_on_launch: true
    ask_variables_on_launch: true
    credentials:
      - APD Machine Credential

controller_workflows:
  - name: OpenShift | CNV | Infra Stack
    description: A workflow to deploy Virtualized infra in OCP Virtalization
    organization: Ansible Product Demos (APD)
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: SSH Authorized Key
          type: textarea
          variable: ssh_authorized_key
          required: true
        - question_name: RHEL Activation Key
          type: text
          variable: rh_subscription_key
          required: true
        - question_name: RHEL Organization ID
          type: text
          variable: rh_subscription_org
          required: true
        - question_name: Email
          type: text
          variable: email
          required: true
    simplified_workflow_nodes:
      - identifier: Deploy RHEL8 VM
        unified_job_template: OpenShift | CNV | Create RHEL VM
        extra_data:
          vm_name: rhel8
          os_version: rhel8
        success_nodes:
          - Update Inventory
        failure_nodes:
          - Ticket - Instance Failed
      - identifier: Deploy RHEL9 VM
        unified_job_template: OpenShift | CNV | Create RHEL VM
        extra_data:
          vm_name: rhel9
          os_version: rhel9
        success_nodes:
          - Update Inventory
        failure_nodes:
          - Ticket - Instance Failed
      - identifier: Update Inventory
        unified_job_template: OpenShift CNV Inventory
      - identifier: Ticket - Instance Failed
        unified_job_template: 'SUBMIT FEEDBACK'
        extra_data:
          feedback: Failed to create CNV instance

  - name: OpenShift | CNV | Patch CNV Workflow
    description: A workflow to patch CNV instances with snapshot and restore on failure.
    organization: Ansible Product Demos (APD)
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Specify target hosts
          type: text
          variable: _hosts
          required: true
          default: "openshift-cnv-rhel*"
    simplified_workflow_nodes:
      - identifier: Project Sync
        unified_job_template: Ansible Product Demos
        success_nodes:
          - Patch Instance
      # We need to do an invnetory sync *after* creating snapshots, as turning VMs on/off changes their IP
      - identifier: Inventory Sync
        unified_job_template: OpenShift CNV Inventory
        success_nodes:
          - Patch Instance
      - identifier: Take Snapshot
        unified_job_template: OpenShift | CNV | Create VM Snapshots
        success_nodes:
          - Project Sync
          - Inventory Sync
      - identifier: Patch Instance
        unified_job_template: OpenShift | CNV | Patch
        job_type: run
        failure_nodes:
          - Restore from Snapshot
      - identifier: Restore from Snapshot
        unified_job_template: OpenShift | CNV | Restore Latest VM Snapshots
        failure_nodes:
          - Ticket - Restore Failed
      - identifier: Ticket - Restore Failed
        unified_job_template: 'SUBMIT FEEDBACK'
        extra_data:
          feedback: OpenShift | CNV | Patch CNV Workflow | Failed to restore CNV VM from snapshot

  - name: OpenShift | Windows | BSOD Recovery
    description: >
      Automates the process of provisioning Windows infrastructure,
      triggering a simulated BSOD, recovering via WinPE boot, and
      verifying the fix on OpenShift Virtualization.
    organization: Ansible Product Demos (APD)
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    extra_vars:
      infra_template_name: windows-2022-standard
    simplified_workflow_nodes:
      - identifier: Provision Infrastructure
        unified_job_template: OpenShift | Windows | Provision Infrastructure
        credentials:
          - OpenShift Credential
          - APD Machine Credential
        extra_data:
          provider: kubevirt
          scenario: bsod_fix
          infra_template_name: windows-2022-standard
        success_nodes:
          - Inventory Sync
      - identifier: Inventory Sync
        unified_job_template: OpenShift CNV Inventory
        success_nodes:
          - Produce BSOD
      - identifier: Produce BSOD
        unified_job_template: OpenShift | Windows | Produce BSOD
        inventory: Ansible Product Demos Windows Inventory
        credentials:
          - APD Machine Credential
        limit: label_app_name_bsodfix
        success_nodes:
          - Recover from BSOD
      - identifier: Recover from BSOD
        unified_job_template: OpenShift | Windows | Recover from BSOD
        inventory: Ansible Product Demos Windows Inventory
        credentials:
          - OpenShift Credential
          - APD Machine Credential
        limit: label_app_name_bsodfix
        extra_data:
          provider: kubevirt
          scenario: bsod_fix
        success_nodes:
          - Inventory Sync 2
      - identifier: Inventory Sync 2
        unified_job_template: OpenShift CNV Inventory
        success_nodes:
          - Check System
      - identifier: Check System
        unified_job_template: OpenShift | Windows | Check System
        inventory: Ansible Product Demos Windows Inventory
        credentials:
          - APD Machine Credential
        limit: label_app_name_bsodfix

  - name: OpenShift | Windows | Generate WinPE Image
    description: >
      Provisions a Windows system, generates a WinPE recovery ISO,
      uploads it to OpenShift Virtualization, and removes the build VM.
    organization: Ansible Product Demos (APD)
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    extra_vars:
      infra_template_name: windows-2022-standard
    simplified_workflow_nodes:
      - identifier: Provision Infrastructure
        unified_job_template: OpenShift | Windows | Provision Infrastructure
        credentials:
          - OpenShift Credential
          - APD Machine Credential
        extra_data:
          provider: kubevirt
          scenario: winpe
          infra_template_name: windows-2022-standard
        success_nodes:
          - Inventory Sync
      - identifier: Inventory Sync
        unified_job_template: OpenShift CNV Inventory
        success_nodes:
          - Generate WinPE
      - identifier: Generate WinPE
        unified_job_template: OpenShift | Windows | Generate WinPE
        inventory: Ansible Product Demos Windows Inventory
        credentials:
          - OpenShift Credential
          - APD Machine Credential
        limit: label_app_name_winpe
        extra_data:
          create_winpe_destination_file_location: iso_upload
          create_winpe_enable_autostart: true
          create_winpe_enable_powershell_modules: false
          create_winpe_enable_script_debug: false
          create_winpe_load_drivers: true
        success_nodes:
          - Upload WinPE ISO
      - identifier: Upload WinPE ISO
        unified_job_template: OpenShift | Windows | Upload WinPE ISO
        inventory: Ansible Product Demos Windows Inventory
        credentials:
          - OpenShift Credential
          - APD Machine Credential
        limit: label_app_name_winpe
        extra_data:
          provider: kubevirt
        success_nodes:
          - Remove Infrastructure
      - identifier: Remove Infrastructure
        unified_job_template: OpenShift | Windows | Remove Infrastructure
        inventory: Ansible Product Demos Windows Inventory
        credentials:
          - OpenShift Credential
          - APD Machine Credential
        limit: label_app_name_winpe
        extra_data:
          provider: kubevirt

  - name: OpenShift | Windows | Clean up BSOD VMs
    description: Removes Windows VMs provisioned for the BSOD recovery demo.
    organization: Ansible Product Demos (APD)
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    extra_vars:
      infra_template_name: windows-2022-standard
    simplified_workflow_nodes:
      - identifier: Remove Infrastructure
        unified_job_template: OpenShift | Windows | Remove Infrastructure
        inventory: Ansible Product Demos Windows Inventory
        credentials:
          - OpenShift Credential
          - APD Machine Credential
        limit: label_app_name_bsodfix
        extra_data:
          provider: kubevirt
          scenario: bsod_fix
