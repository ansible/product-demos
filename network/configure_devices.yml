---
- name: Configure the multi-vendor lab using network resource modules
  hosts: "{{ _hosts | default('containerlab') }}"
  gather_facts: false
  # Each vendor has a different dependency order for its resource modules.
  strategy: free
  pre_tasks:
    - name: Wait for the selected device management service
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ ansible_port }}"
        search_regex: SSH
        timeout: "{{ ansible_connect_timeout | default(900) }}"
      delegate_to: localhost
  roles:
    - role: demo.network.configure_lab
