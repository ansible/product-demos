---
- name: Teardown Containerlab Topology
  hosts: localhost
  connection: local
  gather_facts: false

  roles:
    - role: demo.network.containerlab

  tasks:
    - name: Discover hypervisor IP from EC2 tags
      amazon.aws.ec2_instance_info:
        region: "{{ clab_aws_region | default('us-east-2') }}"
        filters:
          "tag:deployment": containerlab
          "tag:purpose": "{{ clab_aws_purpose_tag }}"
          instance-state-name: running
      register: clab_discovered
      when: clab_host_ip is not defined

    - name: Set host IP from discovery
      ansible.builtin.set_fact:
        clab_host_ip: "{{ clab_discovered.instances[0].public_ip_address }}"
        clab_instance_id: "{{ clab_discovered.instances[0].instance_id }}"
      when:
        - clab_host_ip is not defined
        - clab_discovered.instances | length > 0

    - name: Skip topology teardown when no hypervisor is running
      ansible.builtin.debug:
        msg: "No running containerlab hypervisor found; skipping topology teardown"
      when: clab_host_ip is not defined

    - name: Verify hypervisor SSH is reachable from execution node
      ansible.builtin.wait_for:
        host: "{{ clab_host_ip }}"
        port: 22
        timeout: 30
      register: clab_hypervisor_ssh_check
      failed_when: false
      when: clab_host_ip is defined

    - name: Warn when hypervisor SSH is unreachable
      ansible.builtin.debug:
        msg: >-
          Hypervisor {{ clab_instance_id | default('unknown') }} at {{ clab_host_ip }} is
          unreachable on SSH port 22. Skipping containerlab destroy on the host. Run
          NETWORK | Containerlab | Teardown Hypervisor or the Destroy Containerlab Stack
          workflow to remove the EC2 instance and AWS resources.
      when:
        - clab_host_ip is defined
        - clab_hypervisor_ssh_check.failed

    - name: Add hypervisor to inventory
      ansible.builtin.add_host:
        name: clab-hypervisor
        ansible_host: "{{ clab_host_ip }}"
        ansible_user: "{{ clab_aws_admin_user }}"
        ansible_ssh_private_key_file: "{{ (lookup('ansible.builtin.env', 'AWX_HOST') | length > 0) | ternary(omit, playbook_dir + '/' + clab_aws_keypair_name + '.pem') }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        clab_host_ip: "{{ clab_host_ip }}"
        groups: clab_hosts
      when:
        - clab_host_ip is defined
        - not (clab_hypervisor_ssh_check.failed | default(false))

- name: Destroy Containerlab Topology on Hypervisor
  hosts: clab_hosts
  become: true
  gather_facts: false

  roles:
    - role: demo.network.containerlab

  tasks:
    - name: Discover deployed topology
      ansible.builtin.include_role:
        name: demo.network.containerlab
        tasks_from: discover_active

    - name: Destroy containerlab topology
      ansible.builtin.command:
        cmd: containerlab destroy --cleanup --runtime podman
        chdir: "{{ clab_root_dir }}/{{ clab_active_topology }}/"
      environment:
        DOCKER_HOST: "unix:///run/user/1000/podman/podman.sock"
      register: clab_destroy
      changed_when: clab_destroy.rc == 0
      # Stack teardown must still be able to remove AWS resources if destroy fails.
      failed_when: false
      when: clab_active_topology | length > 0

    - name: Clear active topology record
      ansible.builtin.copy:
        dest: "{{ clab_root_dir }}/active_topology"
        content: ""
        mode: '0644'
      when: clab_destroy.rc | default(1) == 0

    - name: Remove the generated report for the destroyed topology
      ansible.builtin.file:
        path: /var/www/html/network
        state: absent

    - name: Display result
      ansible.builtin.debug:
        msg: >-
          {% if clab_active_topology | length == 0 %}
          No deployed topology found
          {% elif clab_destroy.rc == 0 %}
          Containerlab topology '{{ clab_active_topology }}' destroyed
          {% else %}
          Containerlab could not destroy '{{ clab_active_topology }}': {{ clab_destroy.stderr | default(clab_destroy.msg | default('unknown error'), true) }}.
          The active topology record was retained. Run Troubleshoot, or Destroy Containerlab Stack to remove AWS resources.
          {% endif %}
