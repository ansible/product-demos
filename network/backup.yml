---
- name: Wait for Containerlab Devices
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Wait for n9kv SSH to be ready
      ansible.builtin.wait_for:
        host: "{{ hostvars['n9kv']['ansible_host'] }}"
        port: 2122
        search_regex: SSH
        delay: 10
        timeout: 600

    - name: Wait for cat8kv SSH to be ready
      ansible.builtin.wait_for:
        host: "{{ hostvars['cat8kv']['ansible_host'] }}"
        port: 2123
        search_regex: SSH
        delay: 10
        timeout: 600

- name: Backup Containerlab Network Devices
  hosts: containerlab
  gather_facts: false

  vars:
    backup_dir: /tmp/network_backups

  tasks:
    - name: Backup IOS-XE configuration
      cisco.ios.ios_config:
        backup: true
        backup_options:
          dir_path: "{{ backup_dir }}"
          filename: "{{ inventory_hostname }}.cfg"
      when: ansible_network_os == 'cisco.ios.ios'

    - name: Backup NX-OS configuration
      cisco.nxos.nxos_config:
        backup: true
        backup_options:
          dir_path: "{{ backup_dir }}"
          filename: "{{ inventory_hostname }}.cfg"
      when: ansible_network_os == 'cisco.nxos.nxos'

    - name: Display backup location
      run_once: true
      ansible.builtin.debug:
        msg: "Backups saved to {{ backup_dir }}/ on the execution node"
