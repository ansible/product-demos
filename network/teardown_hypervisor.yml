---
- name: Teardown Containerlab Hypervisor and AWS Resources
  hosts: localhost
  connection: local
  gather_facts: false

  roles:
    - role: demo.network.containerlab

  vars:
    clab_aws_region: "{{ clab_aws_region | default('us-east-2') }}"

  tasks:
    - name: Validate region
      ansible.builtin.assert:
        that:
          - clab_aws_region in ['us-east-2', 'us-west-2']
        fail_msg: >-
          Region '{{ clab_aws_region }}' is not supported.
          Use 'us-east-2' or 'us-west-2'.

    - name: Find containerlab EC2 instances by deployment tag
      amazon.aws.ec2_instance_info:
        region: "{{ clab_aws_region }}"
        filters:
          "tag:deployment": containerlab
          instance-state-name:
            - pending
            - running
            - stopping
            - stopped
            - shutting-down
      register: clab_instances_by_deployment

    - name: Find containerlab EC2 instances by name tag
      amazon.aws.ec2_instance_info:
        region: "{{ clab_aws_region }}"
        filters:
          "tag:Name": clab-hypervisor
          instance-state-name:
            - pending
            - running
            - stopping
            - stopped
            - shutting-down
      register: clab_instances_by_name

    - name: Combine discovered containerlab instances
      ansible.builtin.set_fact:
        clab_instances: >-
          {{ (clab_instances_by_deployment.instances + clab_instances_by_name.instances)
             | unique(attribute='instance_id') }}

    - name: Display discovered containerlab instances
      ansible.builtin.debug:
        msg: >-
          Found {{ clab_instances | length }} containerlab instance(s) in {{ clab_aws_region }}:
          {{ clab_instances | map(attribute='instance_id') | list }}

    - name: Terminate EC2 instances
      amazon.aws.ec2_instance:
        state: absent
        instance_ids: "{{ clab_instances | map(attribute='instance_id') | list }}"
        region: "{{ clab_aws_region }}"
        wait: true
      when: clab_instances | length > 0

    - name: Warn when no containerlab instances were found
      ansible.builtin.debug:
        msg: >-
          No containerlab EC2 instances were found in {{ clab_aws_region }}.
          Continuing with VPC and keypair cleanup.
      when: clab_instances | length == 0

    - name: Look up clab VPCs
      amazon.aws.ec2_vpc_net_info:
        region: "{{ clab_aws_region }}"
        filters:
          "tag:Name": "{{ clab_aws_vpc_name }}"
      register: clab_vpc_info

    - name: Tear down each clab VPC
      ansible.builtin.include_tasks: tasks/teardown_clab_vpc.yml
      vars:
        clab_vpc_id: "{{ item.id }}"
      loop: "{{ clab_vpc_info.vpcs | default([]) }}"
      loop_control:
        label: "{{ item.id }}"

    - name: Warn when no clab VPCs were found
      ansible.builtin.debug:
        msg: >-
          No VPCs named {{ clab_aws_vpc_name }} were found in {{ clab_aws_region }}.
          Continuing with keypair cleanup.
      when: clab_vpc_info.vpcs | default([]) | length == 0

    - name: Delete keypair
      amazon.aws.ec2_key:
        name: "{{ clab_aws_keypair_name }}"
        region: "{{ clab_aws_region }}"
        state: absent

    - name: Remove local private key file
      ansible.builtin.file:
        path: "{{ playbook_dir }}/{{ clab_aws_keypair_name }}.pem"
        state: absent

    - name: Display teardown result
      ansible.builtin.debug:
        msg: "All containerlab AWS resources in {{ clab_aws_region }} have been removed"
