---
- name: Teardown Containerlab Hypervisor and AWS Resources
  hosts: localhost
  connection: local
  gather_facts: false

  roles:
    - role: demo.network.containerlab

  vars:
    clab_aws_region: "{{ clab_aws_region | default('us-east-2') }}"

  tasks:
    - name: Validate region
      ansible.builtin.assert:
        that:
          - clab_aws_region in ['us-east-2', 'us-west-2']
        fail_msg: >-
          Region '{{ clab_aws_region }}' is not supported.
          Use 'us-east-2' or 'us-west-2'.

    - name: Find running clab instances
      amazon.aws.ec2_instance_info:
        region: "{{ clab_aws_region }}"
        filters:
          "tag:deployment": containerlab
          "tag:purpose": "{{ clab_aws_purpose_tag }}"
          instance-state-name:
            - running
            - stopped
      register: clab_instances

    - name: Terminate EC2 instances
      amazon.aws.ec2_instance:
        state: absent
        instance_ids: "{{ clab_instances.instances | map(attribute='instance_id') | list }}"
        region: "{{ clab_aws_region }}"
        wait: true
      when: clab_instances.instances | length > 0

    - name: Look up VPC
      amazon.aws.ec2_vpc_net_info:
        region: "{{ clab_aws_region }}"
        filters:
          "tag:Name": "{{ clab_aws_vpc_name }}"
      register: clab_vpc_info

    - name: Set VPC ID fact
      ansible.builtin.set_fact:
        clab_vpc_id: "{{ clab_vpc_info.vpcs[0].id }}"
      when: clab_vpc_info.vpcs | length > 0

    - name: Delete subnet
      amazon.aws.ec2_vpc_subnet:
        state: absent
        vpc_id: "{{ clab_vpc_id }}"
        cidr: "{{ clab_aws_subnet_cidr }}"
        region: "{{ clab_aws_region }}"
      when: clab_vpc_id is defined

    - name: Delete route table
      amazon.aws.ec2_vpc_route_table:
        state: absent
        vpc_id: "{{ clab_vpc_id }}"
        region: "{{ clab_aws_region }}"
        tags:
          Name: "{{ clab_aws_rt_name }}"
        lookup: tag
      when: clab_vpc_id is defined

    - name: Delete security group
      amazon.aws.ec2_security_group:
        state: absent
        name: "{{ clab_aws_sg_name }}"
        region: "{{ clab_aws_region }}"
        vpc_id: "{{ clab_vpc_id }}"
      when: clab_vpc_id is defined

    - name: Delete internet gateway
      amazon.aws.ec2_vpc_igw:
        state: absent
        vpc_id: "{{ clab_vpc_id }}"
        region: "{{ clab_aws_region }}"
      when: clab_vpc_id is defined

    - name: Delete VPC
      amazon.aws.ec2_vpc_net:
        state: absent
        name: "{{ clab_aws_vpc_name }}"
        cidr_block: "{{ clab_aws_vpc_cidr }}"
        region: "{{ clab_aws_region }}"
      when: clab_vpc_id is defined

    - name: Delete keypair
      amazon.aws.ec2_key:
        name: "{{ clab_aws_keypair_name }}"
        region: "{{ clab_aws_region }}"
        state: absent

    - name: Remove local private key file
      ansible.builtin.file:
        path: "{{ playbook_dir }}/{{ clab_aws_keypair_name }}.pem"
        state: absent

    - name: Display teardown result
      ansible.builtin.debug:
        msg: "All containerlab AWS resources in {{ clab_aws_region }} have been removed"
