---
- name: Deploy Containerlab on Hypervisor
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]

  roles:
    - role: demo.network.containerlab

  tasks:
    - name: Discover hypervisor IP from EC2 tags
      amazon.aws.ec2_instance_info:
        region: "{{ clab_aws_region | default('us-east-2') }}"
        filters:
          "tag:deployment": containerlab
          "tag:purpose": "{{ clab_aws_purpose_tag }}"
          instance-state-name: running
      register: clab_discovered
      when: clab_host_ip is not defined

    - name: Set host IP from discovery
      ansible.builtin.set_fact:
        clab_host_ip: "{{ clab_discovered.instances[0].public_ip_address }}"
        clab_instance_id: "{{ clab_discovered.instances[0].instance_id }}"
      when:
        - clab_host_ip is not defined
        - clab_discovered.instances | length > 0

    - name: Warn when multiple containerlab hypervisors are running
      ansible.builtin.debug:
        msg: >-
          Found {{ clab_discovered.instances | length }} running containerlab hypervisors in
          {{ clab_aws_region | default('us-east-2') }}. Using
          {{ clab_instance_id | default('unknown') }} at {{ clab_host_ip }}.
      when:
        - clab_discovered.instances is defined
        - clab_discovered.instances | length > 1

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - clab_host_ip is defined
          - clab_aws_keypair_name is defined
        fail_msg: >-
          No running containerlab hypervisor found in {{ clab_aws_region | default('us-east-2') }}.
          Run NETWORK | Deploy Containerlab Stack first or pass clab_host_ip as an extra variable.

    - name: Resolve target VPC for management port rules
      amazon.aws.ec2_instance_info:
        region: "{{ clab_aws_region }}"
        instance_ids: "{{ [clab_instance_id] if clab_instance_id is defined else omit }}"
        filters: "{{ {'ip-address': clab_host_ip} if clab_instance_id is not defined else omit }}"
      register: clab_target_metadata

    - name: Require an unambiguous EC2 target
      ansible.builtin.assert:
        that:
          - clab_target_metadata.instances | length == 1
        fail_msg: Could not resolve the selected EC2 hypervisor in this region.

    - name: Refresh APD inventory discovery tags
      amazon.aws.ec2_tag:
        region: "{{ clab_aws_region }}"
        resource: "{{ clab_target_metadata.instances[0].instance_id }}"
        state: present
        tags:
          managed-by: "{{ apd_managed_by | default('aap-product-demos') }}"
          apd_id: "{{ apd_id }}"
      when: apd_id is defined

    - name: Refresh management port rules for existing lab deployments
      amazon.aws.ec2_security_group:
        name: "{{ clab_aws_sg_name }}"
        description: Containerlab hypervisor - SSH and port-mapped device access
        region: "{{ clab_aws_region }}"
        vpc_id: "{{ clab_target_metadata.instances[0].vpc_id }}"
        rules: "{{ clab_security_group_rules }}"
        purge_rules: true
        state: present

    - name: Display hypervisor target
      ansible.builtin.debug:
        msg:
          - "Deploying topology on hypervisor {{ clab_host_ip }}"
          - "Instance ID: {{ clab_instance_id | default('not discovered') }}"
          - "Region: {{ clab_aws_region | default('us-east-2') }}"

    - name: Verify hypervisor SSH is reachable from execution node
      ansible.builtin.wait_for:
        host: "{{ clab_host_ip }}"
        port: 22
        timeout: 30
      register: clab_hypervisor_ssh_check
      failed_when: false

    - name: Stop when hypervisor SSH is unreachable
      ansible.builtin.fail:
        msg: >-
          Hypervisor {{ clab_instance_id | default('unknown') }} at {{ clab_host_ip }} is tagged
          running in AWS but SSH port 22 is unreachable from the execution node. Reboot the
          instance in the EC2 console, verify its security group allows TCP 22, or run
          NETWORK | Destroy Containerlab Stack and redeploy the full stack.
      when: clab_hypervisor_ssh_check.failed

    - name: Add hypervisor to inventory
      ansible.builtin.add_host:
        name: clab-hypervisor
        ansible_host: "{{ clab_host_ip }}"
        ansible_user: "{{ clab_aws_admin_user }}"
        ansible_ssh_private_key_file: "{{ (lookup('ansible.builtin.env', 'AWX_HOST') | length > 0) | ternary(omit, playbook_dir + '/' + clab_aws_keypair_name + '.pem') }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        clab_host_ip: "{{ clab_host_ip }}"
        groups: clab_hosts

- name: Configure Hypervisor and Deploy Topology
  hosts: clab-hypervisor
  become: true
  gather_facts: true
  tags: [deploy]

  roles:
    - role: demo.network.containerlab

  tasks:
    - name: Check if EBS is already mounted
      ansible.builtin.shell:
        cmd: "mountpoint -q {{ clab_aws_ebs_mount }} && echo mounted || echo not_mounted"
      register: ebs_mount_check
      changed_when: false

    - name: Find EBS data volume
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          lsblk -dno NAME,SIZE --bytes |
          awk '$2 > 50000000000 {print "/dev/" $1}' |
          while read dev; do
            if ! lsblk -no MOUNTPOINT "$dev" | grep -q '/'; then echo "$dev"; break; fi
          done
        executable: /bin/bash
      register: ebs_detect
      changed_when: false
      when: ebs_mount_check.stdout == 'not_mounted'

    - name: Set EBS device fact
      ansible.builtin.set_fact:
        clab_ebs_device: "{{ ebs_detect.stdout | trim }}"
      when: ebs_mount_check.stdout == 'not_mounted'

    - name: Fail if no EBS data volume found
      ansible.builtin.assert:
        that:
          - clab_ebs_device | length > 0
        fail_msg: "No unmounted EBS volume >50GB found"
      when: ebs_mount_check.stdout == 'not_mounted'

    - name: Format EBS volume
      community.general.filesystem:
        fstype: xfs
        dev: "{{ clab_ebs_device }}"
      when: ebs_mount_check.stdout == 'not_mounted'

    - name: Create mount point
      ansible.builtin.file:
        path: "{{ clab_aws_ebs_mount }}"
        state: directory
        mode: '0777'
      when: ebs_mount_check.stdout == 'not_mounted'

    - name: Mount EBS volume
      ansible.posix.mount:
        path: "{{ clab_aws_ebs_mount }}"
        src: "{{ clab_ebs_device }}"
        fstype: xfs
        state: mounted
      when: ebs_mount_check.stdout == 'not_mounted'

    - name: Ensure KVM kernel module is loaded
      community.general.modprobe:
        name: kvm_intel
        params: nested=1
        state: present

    - name: Check hardware virtualization before starting devices
      ansible.builtin.stat:
        path: /dev/kvm
      register: clab_kvm_device

    - name: Require an accessible KVM device
      ansible.builtin.assert:
        that:
          - clab_kvm_device.stat.exists
          - clab_kvm_device.stat.ischr
        fail_msg: This hypervisor does not expose /dev/kvm. Validate EC2 nested virtualization before deploying the lab.

    - name: Install podman
      ansible.builtin.package:
        name: podman
        state: present

    - name: Configure podman system storage
      ansible.builtin.lineinfile:
        path: /etc/containers/storage.conf
        regexp: '^#?graphroot ?='
        line: 'graphroot = "{{ clab_podman_image_path }}"'
        mode: '0644'
        create: true

    - name: Restart podman service
      ansible.builtin.systemd:
        name: podman
        state: restarted

    - name: Create user containers config directory
      ansible.builtin.file:
        path: "/home/{{ clab_aws_admin_user }}/.config/containers"
        state: directory
        owner: "{{ clab_aws_admin_user }}"
        group: "{{ clab_aws_admin_user }}"
        mode: '0755'

    - name: Configure podman storage for non-root user
      ansible.builtin.copy:
        dest: "/home/{{ clab_aws_admin_user }}/.config/containers/storage.conf"
        content: "{{ clab_podman_user_storage_content }}"
        owner: "{{ clab_aws_admin_user }}"
        group: "{{ clab_aws_admin_user }}"
        mode: '0644'

    - name: Enable lingering for the user
      ansible.builtin.command: "loginctl enable-linger {{ clab_aws_admin_user }}"
      changed_when: true

    - name: Enable podman socket
      ansible.builtin.systemd:
        name: podman.socket
        scope: user
        enabled: true
        state: started
      become: false

    - name: Sync container images
      containers.podman.podman_image:
        name: "{{ item }}"
        state: present
      loop: "{{ clab_images }}"

    - name: Install containerlab
      ansible.builtin.shell:
        cmd: bash -c "$(curl -sL https://get.containerlab.dev)"
      args:
        creates: /usr/bin/containerlab

    - name: Render topology and device bootstrap configurations
      ansible.builtin.include_role:
        name: demo.network.containerlab
        tasks_from: render_configs

    - name: Configure persistent report web server
      ansible.builtin.include_role:
        name: demo.network.report_server

    - name: Deploy containerlab topology
      ansible.builtin.command:
        cmd: containerlab deploy --reconfigure --runtime podman
        chdir: "/root/clab/{{ clab_topology }}/"
      environment:
        DOCKER_HOST: "unix:///run/user/1000/podman/podman.sock"
      retries: 2
      changed_when: true
      register: clab_deploy

    - name: Wait for device management services
      ansible.builtin.wait_for:
        port: "{{ item.value.port }}"
        host: 127.0.0.1
        search_regex: SSH
        timeout: "{{ item.value.timeout }}"
      loop: "{{ clab_devices | dict2items }}"
      loop_control:
        label: "{{ item.key }} ({{ item.value.connection }})"

    - name: Display device connection information
      ansible.builtin.debug:
        msg: "{{ item.key }}: ssh -p {{ item.value.ssh_port }} {{ clab_device_username }}@{{ ansible_host }}"
      loop: "{{ clab_devices | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

- name: Update ContainerLab Inventory in AAP
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [inventory]

  roles:
    - role: demo.network.containerlab

  tasks:
    - name: Update device hosts in AAP inventory
      ansible.controller.host:
        name: "{{ item.key }}"
        inventory: ContainerLab Inventory
        variables:
          ansible_host: "{{ clab_host_ip }}"
          ansible_port: "{{ item.value.port }}"
          ansible_network_os: "{{ item.value.network_os }}"
          ansible_connection: "{{ item.value.connection }}"
          ansible_connect_timeout: "{{ item.value.timeout }}"
          ansible_command_timeout: 120
        state: present
      loop: "{{ clab_devices | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when: lookup('ansible.builtin.env', 'AWX_HOST') | length > 0
