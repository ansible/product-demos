---
version: 3
images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-27/ee-minimal-rhel9:2.16
dependencies:
  galaxy: requirements-27.yml
  system:
    - python3.12-devel [platform:rpm]
    # development requirements for ansible.eda collection, removed in append_final
    - systemd-devel [platform:rpm]
  python:
    - pywinrm>=0.4.3
    - ncclient>=0.7.0
    - passlib>=1.7.4
  python_interpreter:
    python_path: /usr/bin/python3.12

additional_build_files:
  - src: ansible.cfg
    dest: configs

options:
  package_manager_path: /usr/bin/microdnf

additional_build_steps:
  prepend_base:
    - ARG OPENSHIFT_CLIENT_RPM
    - RUN $PKGMGR -y update && $PKGMGR -y install bash-completion && $PKGMGR clean all
    # microdnf doesn't support URL or local file paths to RPMs, use rpm as a workaround
    - RUN curl -o /tmp/openshift-clients.rpm $OPENSHIFT_CLIENT_RPM && rpm -Uvh /tmp/openshift-clients.rpm && rm -f /tmp/openshift-clients.rpm
  prepend_galaxy:
    - ADD _build/configs/ansible.cfg /etc/ansible/ansible.cfg
    - ARG ANSIBLE_GALAXY_SERVER_CERTIFIED_TOKEN
    - ARG ANSIBLE_GALAXY_SERVER_VALIDATED_TOKEN
  append_final:
    # remove development dependencies
    - RUN microdnf remove -y systemd-devel
    - RUN curl -fsSL -o /tmp/get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 && bash /tmp/get_helm.sh && rm /tmp/get_helm.sh
    - RUN curl -o /etc/yum.repos.d/hashicorp.repo https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo && microdnf install -y terraform

...
