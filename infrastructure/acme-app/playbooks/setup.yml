---
- name: Install ACME App and render baseline storefront
  hosts: "{{ _hosts | default('aws_rhel9') }}"
  become: true

  vars:
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Load ACME App baseline defaults
      ansible.builtin.include_vars: "{{ playbook_dir }}/../defaults.yml"

    - name: Check OS family
      ansible.builtin.assert:
        that: ansible_os_family == 'RedHat'
        fail_msg: This demo supports RHEL hosts only.

    - name: Install httpd
      ansible.builtin.dnf:
        name: httpd
        state: present
      notify: Restart httpd

    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Enable firewall http service
      ansible.posix.firewalld:
        service: http
        state: enabled
        immediate: true
        permanent: true
      when:
        - "'firewalld.service' in ansible_facts.services"
        - ansible_facts.services["firewalld.service"].state == "running"

    - name: Disable httpd welcome page
      ansible.builtin.file:
        path: /etc/httpd/conf.d/welcome.conf
        state: absent
      notify: Restart httpd

    - name: Render ACME App page
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/render.yml"

    - name: Start and enable httpd
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true

    - name: Show ACME App URL
      ansible.builtin.debug:
        msg: "ACME App is available at http://{{ ansible_host }}/"

  handlers:
    - name: Restart httpd
      ansible.builtin.service:
        name: httpd
        state: restarted
