---
# Upsert Controller OpenFlake credential for AO CI/CD Pipeline JTs.
# Requires AAP Credential injectors (CONTROLLER_HOST + token or user/pass).
- name: Skip OpenFlake credential publish when URL or password is missing
  when: >-
    (openflake_public_url | default('') | length) == 0
    or (_openflake_resolved_admin_password | default('') | length) == 0
  ansible.builtin.debug:
    msg: >-
      Skipping OpenFlake Controller credential publish — public URL or
      admin password was not resolved.

- name: Publish OpenFlake credential to Controller
  when:
    - (openflake_public_url | default('') | length) > 0
    - (_openflake_resolved_admin_password | default('') | length) > 0
  vars:
    openflake_credential_name: OpenFlake
    openflake_credential_organization: Ansible Product Demos (APD)
    _of_controller_host_raw: >-
      {{ lookup('env', 'CONTROLLER_HOST') | default(lookup('env', 'AAP_HOSTNAME'), true)
         | default('', true) }}
    _of_controller_host: "{{ _of_controller_host_raw | regex_replace('/$', '') }}"
    _of_controller_oauth_token: "{{ lookup('env', 'CONTROLLER_OAUTH_TOKEN') | default('', true) }}"
    _of_controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') | default('', true) }}"
    _of_controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') | default('', true) }}"
  block:
    - name: Require Controller API access for OpenFlake credential publish
      ansible.builtin.assert:
        that:
          - (_of_controller_host | default('') | length) > 0
          - >-
            (_of_controller_oauth_token | default('') | length) > 0
            or (
              (_of_controller_username | default('') | length) > 0
              and (_of_controller_password | default('') | length) > 0
            )
        fail_msg: >-
          Attach an AAP Credential to Infrastructure | OpenFlake so
          CONTROLLER_HOST and CONTROLLER_OAUTH_TOKEN (or username/password)
          are available to publish the OpenFlake credential.

    - name: Build Controller API auth facts for OpenFlake
      ansible.builtin.set_fact:
        _of_controller_api: "{{ _of_controller_host }}/api/controller/v2"
        _of_controller_use_token: "{{ (_of_controller_oauth_token | default('') | length) > 0 }}"
      no_log: true

    - name: Look up APD organization for OpenFlake credential
      ansible.builtin.uri:
        url: "{{ _of_controller_api }}/organizations/?name={{ openflake_credential_organization | urlencode }}"
        method: GET
        headers: >-
          {{
            {'Authorization': 'Bearer ' ~ _of_controller_oauth_token, 'Content-Type': 'application/json'}
            if _of_controller_use_token | bool
            else {'Content-Type': 'application/json'}
          }}
        user: "{{ _of_controller_username if not (_of_controller_use_token | bool) else omit }}"
        password: "{{ _of_controller_password if not (_of_controller_use_token | bool) else omit }}"
        force_basic_auth: "{{ not (_of_controller_use_token | bool) }}"
        validate_certs: false
        return_content: true
        status_code: [200]
      register: _of_org_lookup
      no_log: true

    - name: Require APD organization for OpenFlake
      ansible.builtin.assert:
        that:
          - _of_org_lookup.json.results | default([]) | length > 0
        fail_msg: "Organization '{{ openflake_credential_organization }}' was not found in Controller."

    - name: Look up OpenFlake credential type
      ansible.builtin.uri:
        url: "{{ _of_controller_api }}/credential_types/?name={{ openflake_credential_name | urlencode }}"
        method: GET
        headers: >-
          {{
            {'Authorization': 'Bearer ' ~ _of_controller_oauth_token, 'Content-Type': 'application/json'}
            if _of_controller_use_token | bool
            else {'Content-Type': 'application/json'}
          }}
        user: "{{ _of_controller_username if not (_of_controller_use_token | bool) else omit }}"
        password: "{{ _of_controller_password if not (_of_controller_use_token | bool) else omit }}"
        force_basic_auth: "{{ not (_of_controller_use_token | bool) }}"
        validate_certs: false
        return_content: true
        status_code: [200]
      register: _of_cred_type_lookup
      no_log: true

    - name: Require OpenFlake credential type
      ansible.builtin.assert:
        that:
          - _of_cred_type_lookup.json.results | default([]) | length > 0
        fail_msg: >-
          Credential type '{{ openflake_credential_name }}' was not found.
          Re-run APD infrastructure setup so controller_credential_types includes OpenFlake.

    - name: Look up OpenFlake credential
      ansible.builtin.uri:
        url: "{{ _of_controller_api }}/credentials/?name={{ openflake_credential_name | urlencode }}"
        method: GET
        headers: >-
          {{
            {'Authorization': 'Bearer ' ~ _of_controller_oauth_token, 'Content-Type': 'application/json'}
            if _of_controller_use_token | bool
            else {'Content-Type': 'application/json'}
          }}
        user: "{{ _of_controller_username if not (_of_controller_use_token | bool) else omit }}"
        password: "{{ _of_controller_password if not (_of_controller_use_token | bool) else omit }}"
        force_basic_auth: "{{ not (_of_controller_use_token | bool) }}"
        validate_certs: false
        return_content: true
        status_code: [200]
      register: _of_cred_lookup
      no_log: true

    - name: Build OpenFlake credential payload
      ansible.builtin.set_fact:
        _of_cred_payload:
          name: "{{ openflake_credential_name }}"
          description: Updated automatically by Infrastructure | OpenFlake.
          organization: "{{ _of_org_lookup.json.results[0].id | int }}"
          credential_type: "{{ _of_cred_type_lookup.json.results[0].id | int }}"
          inputs:
            instance_url: "{{ openflake_public_url | regex_replace('/$', '') }}"
            username: "{{ _openflake_admin_username }}"
            password: "{{ _openflake_resolved_admin_password }}"
      no_log: true

    - name: Create OpenFlake credential
      when: _of_cred_lookup.json.results | default([]) | length == 0
      ansible.builtin.uri:
        url: "{{ _of_controller_api }}/credentials/"
        method: POST
        headers: >-
          {{
            {'Authorization': 'Bearer ' ~ _of_controller_oauth_token, 'Content-Type': 'application/json'}
            if _of_controller_use_token | bool
            else {'Content-Type': 'application/json'}
          }}
        user: "{{ _of_controller_username if not (_of_controller_use_token | bool) else omit }}"
        password: "{{ _of_controller_password if not (_of_controller_use_token | bool) else omit }}"
        force_basic_auth: "{{ not (_of_controller_use_token | bool) }}"
        body_format: json
        body: "{{ _of_cred_payload }}"
        validate_certs: false
        status_code: [200, 201]
      no_log: true

    - name: Update OpenFlake credential
      when: _of_cred_lookup.json.results | default([]) | length > 0
      ansible.builtin.uri:
        url: "{{ _of_controller_api }}/credentials/{{ _of_cred_lookup.json.results[0].id }}/"
        method: PATCH
        headers: >-
          {{
            {'Authorization': 'Bearer ' ~ _of_controller_oauth_token, 'Content-Type': 'application/json'}
            if _of_controller_use_token | bool
            else {'Content-Type': 'application/json'}
          }}
        user: "{{ _of_controller_username if not (_of_controller_use_token | bool) else omit }}"
        password: "{{ _of_controller_password if not (_of_controller_use_token | bool) else omit }}"
        force_basic_auth: "{{ not (_of_controller_use_token | bool) }}"
        body_format: json
        body: "{{ _of_cred_payload }}"
        validate_certs: false
        status_code: [200]
      no_log: true

    - name: Show OpenFlake credential publish result
      ansible.builtin.debug:
        msg:
          - "Controller credential '{{ openflake_credential_name }}' updated."
          - "instance_url={{ openflake_public_url | regex_replace('/$', '') }}"
          - "AO Install attaches this credential to CI/CD Demo job templates."
          - "Login URL/username/password print in the next task (end of job)."
