{{- if not .Values.auth.existingSecret }}
{{/*
Resolve each generated credential exactly once per render and reuse it through
a variable. Calling the helpers twice would produce two different random
values -- the DATABASE_URL below embeds the same password stored in
POSTGRESQL_PASSWORD, and Postgres reads the latter to create the account.
*/}}
{{- $pgPassword := include "openflake.postgresPassword" . -}}
{{- $databaseUrl := printf "postgresql+asyncpg://%s:%s@%s:%v/%s"
      .Values.postgresql.username
      $pgPassword
      (include "openflake.postgresql.fullname" .)
      .Values.postgresql.service.port
      .Values.postgresql.database -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openflake.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openflake.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  DATABASE_URL: {{ $databaseUrl | quote }}
  SECRET_KEY: {{ include "openflake.secretKey" . | quote }}
  ADMIN_USERNAME: {{ .Values.auth.adminUsername | quote }}
  ADMIN_PASSWORD: {{ include "openflake.adminPassword" . | quote }}
  POSTGRESQL_USER: {{ .Values.postgresql.username | quote }}
  POSTGRESQL_PASSWORD: {{ $pgPassword | quote }}
  POSTGRESQL_DATABASE: {{ .Values.postgresql.database | quote }}
{{- end }}
