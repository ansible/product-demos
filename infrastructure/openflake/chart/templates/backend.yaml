{{- if and .Values.backend.attachments.persistence.enabled (not .Values.backend.attachments.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "openflake.backend.fullname" . }}-attachments
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openflake.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    # Uploaded attachments outlive the release; deleting the chart should not
    # silently discard them.
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    - {{ .Values.backend.attachments.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.backend.attachments.persistence.size | quote }}
  {{- if .Values.backend.attachments.persistence.storageClass }}
  storageClassName: {{ .Values.backend.attachments.persistence.storageClass | quote }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openflake.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openflake.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "openflake.selectorLabels" (dict "context" . "component" "backend") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openflake.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openflake.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.backend.replicas }}
  {{- if and .Values.backend.attachments.persistence.enabled (eq .Values.backend.attachments.persistence.accessMode "ReadWriteOnce") }}
  # A ReadWriteOnce attachments volume cannot be attached to an old and a new
  # pod at once, so a rolling update would deadlock.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "openflake.selectorLabels" (dict "context" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openflake.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "openflake.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: {{ include "openflake.backend.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            # Supplies DATABASE_URL, SECRET_KEY, ADMIN_USERNAME, ADMIN_PASSWORD.
            - secretRef:
                name: {{ include "openflake.secretName" . }}
          env:
            - name: BASE_URL
              value: {{ include "openflake.baseUrl" . | quote }}
            - name: CORS_ORIGINS
              value: {{ include "openflake.corsOrigins" . | quote }}
            - name: TRUSTED_PROXIES
              value: {{ .Values.config.trustedProxies | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: ATTACHMENTS_PATH
              value: /data/attachments
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Alembic migrations and first-boot seeding run inside the app's
          # lifespan, before uvicorn starts serving, so /health/live only
          # answers once that finished. The startup probe covers that window.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: {{ .Values.backend.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.backend.startupProbe.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.livenessProbe.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.readinessProbe.timeoutSeconds }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: attachments
              mountPath: /data/attachments
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: attachments
        {{- if .Values.backend.attachments.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-attachments" (include "openflake.backend.fullname" .)) .Values.backend.attachments.persistence.existingClaim }}
        {{- else }}
          emptyDir: {}
        {{- end }}
