---
- name: Deploy auditd and Filebeat for config drift detection
  hosts: "{{ _hosts | default('aws_rhel*') }}"
  become: true
  ignore_unreachable: true

  vars:
    ansible_python_interpreter: auto_silent

  tasks:
    - name: Ensure RHEL 8 uses platform-python for Ansible modules
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../../cloud/tasks/use_platform_python_on_rhel8.yml"

    - name: Check OS family
      ansible.builtin.assert:
        that: ansible_os_family == 'RedHat'
        fail_msg: This demo supports RHEL hosts only.

    - name: Configure auditd monitoring and Filebeat for sshd_config
      ansible.builtin.include_role:
        name: demo.config_drift.audit_filebeat
