---
- name: Deploy auditd and Filebeat for config drift detection
  hosts: "{{ _hosts | default('aws_rhel9') }}"
  become: true
  ignore_unreachable: true
  gather_facts: false

  vars:
    ansible_python_interpreter: /usr/bin/python3.9

  tasks:
    - name: Ensure Python 3 is available for Ansible
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../cloud/tasks/ensure_ansible_python.yml"

    - name: Gather facts
      ansible.builtin.setup:

    - name: Check OS family
      ansible.builtin.assert:
        that: ansible_os_family == 'RedHat'
        fail_msg: This demo supports RHEL hosts only.

    - name: Configure auditd monitoring and Filebeat for sshd_config
      ansible.builtin.include_role:
        name: demo.config_drift.audit_filebeat
