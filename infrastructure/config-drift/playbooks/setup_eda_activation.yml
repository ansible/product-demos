---
- name: Activate config drift Kafka rulebook in EDA
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    config_drift_eda_project: Ansible Product Demos
    config_drift_eda_decision_environment: Product Demos EE
    config_drift_eda_rulebook: extensions/eda/rulebooks/config_drift_kafka.yml
    config_drift_eda_activation_name: config_drift_kafka
    config_drift_kafka_topic: linux-audit-events
    config_drift_apd_organization: Ansible Product Demos (APD)
    config_drift_controller_api_base: >-
      {{ lookup('ansible.builtin.env', 'AAP_HOSTNAME') | regex_replace('/$', '') }}
    config_drift_controller_api_token: "{{ lookup('ansible.builtin.env', 'AAP_TOKEN') }}"
    config_drift_controller_validate_certs: >-
      {{ lookup('ansible.builtin.env', 'AAP_VALIDATE_CERTS') | default('false') | bool }}

  tasks:
    - name: Resolve Kafka broker from inventory
      ansible.builtin.set_fact:
        config_drift_kafka_broker_host: >-
          {{
            hostvars['aws_kafka']['private_ip_address']
            | default(hostvars['aws_kafka']['ansible_host'])
          }}

    - name: Assert Kafka broker is in inventory
      ansible.builtin.assert:
        that:
          - "'aws_kafka' in hostvars"
          - config_drift_kafka_broker_host | length > 0
        fail_msg: >-
          Host aws_kafka was not found in inventory. Run Infrastructure |
          AWS - Provision Kafka Queue, sync AWS inventory, then re-run this job.

    - name: Look up Ansible Product Demos Controller project via API
      ansible.builtin.uri:
        url: >-
          {{ config_drift_controller_api_base }}/api/controller/v2/projects/?name={{
          config_drift_eda_project | urlencode }}
        method: GET
        headers:
          Authorization: "Bearer {{ config_drift_controller_api_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ config_drift_controller_validate_certs }}"
      register: config_drift_projects_api

    - name: Assert Controller project exists for EDA SCM mirror
      ansible.builtin.assert:
        that: config_drift_projects_api.json.results | length > 0
        fail_msg: >-
          Controller project {{ config_drift_eda_project }} was not found.
          Sync the Ansible Product Demos Controller project before running
          this job.

    - name: Set EDA SCM facts from Controller project
      ansible.builtin.set_fact:
        config_drift_eda_scm_url: "{{ config_drift_projects_api.json.results[0].scm_url }}"
        config_drift_eda_scm_branch: "{{ config_drift_projects_api.json.results[0].scm_branch }}"
        config_drift_eda_scm_credential: >-
          {{
            config_drift_projects_api.json.results[0].summary_fields.credential.name
            | default('', true)
          }}

    - name: Look up Product Demos EE from Controller via API
      ansible.builtin.uri:
        url: >-
          {{ config_drift_controller_api_base }}/api/controller/v2/execution_environments/?name={{
          config_drift_eda_decision_environment | urlencode }}
        method: GET
        headers:
          Authorization: "Bearer {{ config_drift_controller_api_token }}"
        return_content: true
        status_code: 200
        validate_certs: "{{ config_drift_controller_validate_certs }}"
      register: config_drift_execution_environments_api

    - name: Assert decision environment image is available
      ansible.builtin.assert:
        that: config_drift_execution_environments_api.json.results | length > 0
        fail_msg: >-
          Execution environment {{ config_drift_eda_decision_environment }}
          was not found in Controller.

    - name: Set decision environment image from Controller EE
      ansible.builtin.set_fact:
        config_drift_eda_decision_environment_image: >-
          {{ config_drift_execution_environments_api.json.results[0].image }}

    - name: Show EDA activation parameters
      ansible.builtin.debug:
        msg:
          - "Broker: {{ config_drift_kafka_broker_host }}:9092"
          - "Topic: {{ config_drift_kafka_topic }}"
          - "Rulebook: {{ config_drift_eda_rulebook }}"
          - "Activation: {{ config_drift_eda_activation_name }}"
          - "EDA project SCM: {{ config_drift_eda_scm_url }} @ {{ config_drift_eda_scm_branch }}"

    - name: Ensure EDA project mirrors Controller SCM
      ansible.builtin.include_role:
        name: infra.aap_configuration.eda_projects
      vars:
        eda_projects:
          - name: "{{ config_drift_eda_project }}"
            description: Ansible Product Demos rulebooks and extensions
            organization: "{{ config_drift_apd_organization }}"
            url: "{{ config_drift_eda_scm_url }}"
            scm_branch: "{{ config_drift_eda_scm_branch }}"
            credential: "{{ config_drift_eda_scm_credential if config_drift_eda_scm_credential | length > 0 else omit }}"
            sync: true

    - name: Ensure EDA decision environment exists
      ansible.builtin.include_role:
        name: infra.aap_configuration.eda_decision_environments
      vars:
        eda_decision_environments:
          - name: "{{ config_drift_eda_decision_environment }}"
            description: Product Demos decision environment for config drift rulebooks
            organization: "{{ config_drift_apd_organization }}"
            image_url: "{{ config_drift_eda_decision_environment_image }}"

    - name: Configure EDA rulebook activation
      ansible.builtin.include_role:
        name: infra.aap_configuration.eda_rulebook_activations
      vars:
        eda_rulebook_activations:
          - name: "{{ config_drift_eda_activation_name }}"
            description: >-
              Listen for sshd_config_change audit events on Kafka topic
              linux-audit-events and launch SSHD remediation.
            organization: "{{ config_drift_apd_organization }}"
            project: "{{ config_drift_eda_project }}"
            rulebook: "{{ config_drift_eda_rulebook }}"
            decision_environment: "{{ config_drift_eda_decision_environment }}"
            enabled: true
            restart_policy: always
            extra_vars:
              config_drift_kafka_broker_host: "{{ config_drift_kafka_broker_host }}"
              config_drift_kafka_broker_port: 9092
              config_drift_kafka_topic: "{{ config_drift_kafka_topic }}"
