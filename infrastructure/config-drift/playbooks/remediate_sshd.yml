---
- name: Resolve remediation target from Kafka event metadata
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Fail if target IP is not defined
      ansible.builtin.assert:
        that:
          - config_drift_target_ip is defined
          - config_drift_target_ip | length > 0
        fail_msg: >-
          config_drift_target_ip was not provided. EDA should pass
          event.host.ip[0] from the Kafka audit message.

    - name: Look up inventory host by private IP
      ansible.builtin.set_fact:
        config_drift_remediate_host: >-
          {{
            groups['cloud_aws']
            | default([])
            | map('extract', hostvars)
            | selectattr('private_ip_address', 'defined')
            | selectattr('private_ip_address', 'equalto', config_drift_target_ip)
            | map(attribute='inventory_hostname')
            | list
            | first
            | default('')
          }}

    - name: Assert inventory host was found for target IP
      ansible.builtin.assert:
        that: config_drift_remediate_host | length > 0
        fail_msg: >-
          No inventory host has private_ip_address {{ config_drift_target_ip }}.
          Sync AWS inventory after provisioning workers and Kafka.

    - name: Register remediation target for follow-on play
      ansible.builtin.add_host:
        name: "{{ config_drift_remediate_host }}"
        groups: config_drift_remediate_targets

- name: Restore approved sshd_config on drifted host
  hosts: config_drift_remediate_targets
  become: true
  gather_facts: false

  tasks:
    - name: Restore PermitRootLogin to approved value
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: PermitRootLogin no
        backup: true

    - name: Validate sshd configuration
      ansible.builtin.command:
        cmd: sshd -t
      changed_when: false

    - name: Reload sshd when configuration is valid
      ansible.builtin.service:
        name: sshd
        state: reloaded

    - name: Show remediation result
      ansible.builtin.debug:
        msg:
          - "Restored PermitRootLogin no on {{ inventory_hostname }}"
          - "Triggered by audit event from {{ config_drift_target_ip }}"
          - "{{ config_drift_audit_message | default('') | truncate(120, True) }}"
