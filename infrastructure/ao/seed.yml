---
# Seed curated AO demos after Install (imported from install.yml).
# Creates AAP project/JTs only for enabled entries in demos.yml so they
# do not sprawl into infrastructure/setup.yml.
- name: Seed Automation Orchestrator demos
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ao_namespace: automation-orchestrator
    ao_instance: automation-orchestrator
    ao_demos_file: "{{ playbook_dir }}/demos.yml"

    _controller_host_raw: >-
      {{ lookup('env', 'CONTROLLER_HOST') | default(lookup('env', 'AAP_HOSTNAME'), true)
         | default('', true) | trim }}
    _controller_host: "{{ _controller_host_raw | regex_replace('/$', '') }}"
    _controller_oauth_token: "{{ lookup('env', 'CONTROLLER_OAUTH_TOKEN') | default('', true) }}"
    _controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') | default('', true) }}"
    _controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') | default('', true) }}"

  tasks:
    - name: Load curated AO demo catalog
      ansible.builtin.include_vars:
        file: "{{ ao_demos_file }}"

    - name: Select enabled demos
      ansible.builtin.set_fact:
        ao_enabled_demos: >-
          {{ ao_demos | selectattr('enabled', 'equalto', true) | list }}

    - name: Skip seeding when no demos are enabled
      ansible.builtin.meta: end_play
      when: ao_enabled_demos | length == 0

    - name: Resolve Automation Orchestrator Route
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        name: "{{ ao_instance }}"
        namespace: "{{ ao_namespace }}"
      register: ao_seed_route
      until: ao_seed_route.resources | default([]) | length > 0
      retries: 20
      delay: 6

    - name: Get Automation Orchestrator admin password
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: automation-orchestrator-initial-admin-password
        namespace: "{{ ao_namespace }}"
      register: ao_seed_admin_secret

    - name: Require AO route and admin password
      ansible.builtin.assert:
        that:
          - ao_seed_route.resources | default([]) | length > 0
          - ao_seed_admin_secret.resources | default([]) | length > 0
          - _controller_host | length > 0
        fail_msg: >-
          AO route, admin password secret, and CONTROLLER_HOST (AAP Credential)
          are required to seed demos.

    - name: Set AO API connection facts
      ansible.builtin.set_fact:
        ao_api_host: "{{ ao_seed_route.resources[0].spec.host }}"
        ao_api_url: "https://{{ ao_seed_route.resources[0].spec.host }}/api/v1"
        ao_admin_password: >-
          {{ ao_seed_admin_secret.resources[0].data.password | b64decode }}
        ao_aap_base_url: "{{ _controller_host }}"
      no_log: true

    - name: Log in to Automation Orchestrator API
      ansible.builtin.include_tasks: tasks/ao_login.yml

    - name: Resolve AAP token for AO integration
      ansible.builtin.include_tasks: tasks/resolve_aap_token.yml

    - name: Wire AO AAP credential and integration
      ansible.builtin.include_tasks: tasks/wire_aap_integration.yml

    - name: Wire Controller LiteMaaS into AO as LLM Provider
      ansible.builtin.include_tasks: tasks/wire_litemaas_integration.yml

    - name: Run demo preflight checks
      ansible.builtin.include_tasks: tasks/preflight.yml

    - name: Provision AAP project and job templates for enabled demos
      ansible.builtin.include_tasks: tasks/provision_aap_demos.yml

    # AAP JT provisioning can outlive the AO JWT; refresh before workflow sync.
    - name: Refresh AO API token before workflow sync
      ansible.builtin.include_tasks: tasks/ao_login.yml

    - name: Ensure AO CI/CD webhook service account
      ansible.builtin.include_tasks: tasks/wire_ao_cicd_service_account.yml

    - name: Synchronize enabled AO workflow exports
      ansible.builtin.include_tasks: tasks/sync_demos.yml

    - name: Publish CI/CD workflow with authorized webhook service account
      ansible.builtin.include_tasks: tasks/publish_cicd_workflow.yml

    - name: Wire AO webhook URL into Gitea Actions secrets
      ansible.builtin.include_tasks: tasks/wire_gitea_ao_webhook.yml

    - name: Record Mattermost warning when credential and inventory are missing
      when:
        - (ao_mattermost_demos | default([]) | length) > 0
        - not (ao_mattermost_present | default(false) | bool)
        - (ao_mattermost_server | default('') | length) == 0
      ansible.builtin.set_fact:
        ao_seed_warnings: >-
          {{
            ao_seed_warnings + [
              'Demo(s) '
              ~ (ao_mattermost_demos | map(attribute='slug') | list | join(', '))
              ~ ' post to Mattermost. Run Infrastructure | AWS - Provision Mattermost '
              ~ '(writes the Mattermost Controller credential and syncs AWS Inventory), '
              ~ 'then re-run Install so Notify Chatroom attaches that credential.'
            ]
          }}

    - name: Record OpenFlake warning when credential is missing
      when:
        - (ao_openflake_demos | default([]) | length) > 0
        - not (ao_openflake_present | default(false) | bool)
      ansible.builtin.set_fact:
        ao_seed_warnings: >-
          {{
            ao_seed_warnings + [
              'Demo(s) '
              ~ (ao_openflake_demos | map(attribute='slug') | list | join(', '))
              ~ ' need OpenFlake. Run Infrastructure | OpenFlake (writes the '
              ~ 'OpenFlake Controller credential), then re-run Install.'
            ]
          }}

    - name: Record Gitea warning when credential or host is missing
      when:
        - (ao_gitea_demos | default([]) | length) > 0
        - >-
          not (ao_gitea_present | default(false) | bool)
          or not (ao_gitea_host_present | default(false) | bool)
      ansible.builtin.set_fact:
        ao_seed_warnings: >-
          {{
            ao_seed_warnings + [
              'Demo(s) '
              ~ (ao_gitea_demos | map(attribute='slug') | list | join(', '))
              ~ ' need aws_gitea + Gitea Controller credential. Run '
              ~ 'Infrastructure | AWS - Deploy Shared Services (or Provision Gitea), '
              ~ 'sync AWS Inventory, then re-run Install.'
            ]
          }}

    # Decode the admin password here (same pattern as install.yml) so no_log
    # on ao_admin_password does not redact this final presenter-facing summary.
    - name: Show seed summary
      ansible.builtin.debug:
        msg: >-
          {{
            [
              'AO demos seeded: ' ~ (ao_enabled_demos | map(attribute='slug') | list | join(', ')),
              'AO URL: https://' ~ ao_api_host,
              'Username: admin',
              'Password: ' ~ (ao_seed_admin_secret.resources[0].data.password | b64decode),
              'AAP project: ' ~ ao_demos_project_name,
            ]
            + (
              [
                'Mattermost URL: http://' ~ ao_mattermost_server,
                'Mattermost Username: apdadmin',
                'Mattermost Password: Ansible123!',
                'Mattermost endpoint source: '
                ~ (ao_mattermost_server_source | default('unknown')),
                'Mattermost Controller credential: attached to Notify Chatroom when present',
              ]
              if (ao_mattermost_server | default('') | length) > 0
              else [
                'Mattermost: not provisioned — run Infrastructure | AWS - Provision Mattermost (updates Mattermost credential + syncs inventory)',
              ]
            )
            + (
              [
                'OpenFlake URL: ' ~ ao_openflake_url,
                'OpenFlake Controller credential: attached to CI/CD Demo JTs when present',
              ]
              if (ao_openflake_present | default(false) | bool)
              else (
                [
                  'OpenFlake: not provisioned — run Infrastructure | OpenFlake for cicd-pipeline',
                ]
                if (ao_openflake_demos | default([]) | length) > 0
                else []
              )
            )
            + (
              (
                [
                  'Gitea URL: http://' ~ ao_gitea_host ~ ':' ~ ao_gitea_port,
                  'Gitea Controller credential: attached to CI/CD Demo JTs when present',
                ]
                + (
                  [
                    'Gitea Actions AO webhook secrets: set (AO_WEBHOOK_URL'
                    ~ (
                      ', AO_TOKEN_URL, AO_CLIENT_ID, AO_CLIENT_SECRET'
                      if (ao_gitea_oauth_secrets_set | default(false) | bool)
                      else ''
                    )
                    ~ ') → ' ~ ao_cicd_webhook_url,
                  ]
                  if (ao_gitea_webhook_secret_set | default(false) | bool)
                  else []
                )
                + (
                  [
                    'AO CI/CD webhook service account: authorized + workflow published',
                  ]
                  if (ao_cicd_workflow_published | default(false) | bool)
                  else (
                    [
                      'AO CI/CD webhook service account: prepared (publish pending)',
                    ]
                    if (ao_cicd_sa_ready | default(false) | bool)
                    else []
                  )
                )
              )
              if (ao_gitea_present | default(false) | bool)
              else (
                [
                  'Gitea: not provisioned — run Infrastructure | AWS - Deploy Shared Services / Provision Gitea for cicd-pipeline',
                ]
                if (ao_gitea_demos | default([]) | length) > 0
                else []
              )
            )
            + (
              [
                'AO LLM: ' ~ ao_llm_integration_name
                ~ ' (model ' ~ (ao_llm_model_name | default(ao_llm_model))
                ~ ', id ' ~ ao_llm_model_id ~ ')',
              ]
              if (
                (ao_litemaas_present | default(false) | bool)
                and (ao_llm_model_id | default('') | length) > 0
                and (ao_llm_credential_id | default('') | length) > 0
              )
              else (
                [
                  'AO LLM: credential/integration created but no model id yet — see warnings',
                ]
                if (ao_litemaas_present | default(false) | bool)
                else [
                  'AO LLM: not wired — ensure Controller LiteMaaS is populated and attached to Install',
                ]
              )
            )
          }}

    - name: Warn about missing demo prerequisites
      when: (ao_seed_warnings | default([]) | length) > 0
      ansible.builtin.debug:
        msg: "{{ ['WARNING: demo prerequisites incomplete:'] + ao_seed_warnings }}"
