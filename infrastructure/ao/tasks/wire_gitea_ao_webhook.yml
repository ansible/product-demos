---
# When Gitea is provisioned, set inventory-service Actions secret AO_WEBHOOK_URL
# to the seeded lightwell-ci-cd webhook so CI can trigger AO without a manual step.
# Requires the Gitea Controller credential attached to AO Install (token inject).
- name: Skip Gitea AO webhook secret when Gitea is not ready
  when: >-
    not (ao_gitea_present | default(false) | bool)
    or (ao_gitea_demos | default([]) | length) == 0
  ansible.builtin.debug:
    msg: >-
      Skipping AO_WEBHOOK_URL Gitea Actions secret — provision Gitea and
      re-run Install when ready for cicd-pipeline.

- name: Configure Gitea Actions AO_WEBHOOK_URL secret
  when:
    - ao_gitea_present | default(false) | bool
    - (ao_gitea_demos | default([]) | length) > 0
  vars:
    _ao_cicd_webhook_url: "https://{{ ao_api_host }}/api/v1/webhooks/lightwell-ci-cd"
    _gitea_api_base: "http://{{ ao_gitea_host }}:{{ ao_gitea_port | default('3000') }}/api/v1"
    _gitea_owner: "{{ ao_gitea_owner | default(gitea_owner | default('apdadmin')) }}"
    _gitea_repo: "{{ ao_gitea_repo | default(gitea_repo | default('inventory-service')) }}"
    # Prefer JT-injected token from attached Gitea credential; never log it.
    _gitea_token: "{{ gitea_token | default('') }}"
    _gitea_token_usable: >-
      {{
        (_gitea_token | default('') | length) > 0
        and (_gitea_token | default('')) not in ['REPLACEME', 'replace_me']
      }}
  block:
    - name: Soft-warn when Gitea token is missing for webhook secret
      when: not (_gitea_token_usable | bool)
      ansible.builtin.set_fact:
        ao_seed_warnings: >-
          {{
            ao_seed_warnings + [
              'Could not set Gitea Actions secret AO_WEBHOOK_URL — attach the '
              ~ 'Gitea credential to AO Install (injects gitea_token), then re-run Install. '
              ~ 'Webhook URL would be: ' ~ _ao_cicd_webhook_url
            ]
          }}

    - name: Upsert Gitea Actions secret AO_WEBHOOK_URL
      when: _gitea_token_usable | bool
      ansible.builtin.uri:
        url: >-
          {{ _gitea_api_base }}/repos/{{ _gitea_owner }}/{{ _gitea_repo }}/actions/secrets/AO_WEBHOOK_URL
        method: PUT
        headers:
          Authorization: "token {{ _gitea_token }}"
          Content-Type: application/json
        body_format: json
        body:
          data: "{{ _ao_cicd_webhook_url }}"
          description: AO CI/CD Pipeline webhook (lightwell-ci-cd) — set by APD AO Install
        status_code: [201, 204]
        validate_certs: false
      no_log: true
      register: _gitea_webhook_secret
      failed_when: false

    - name: Soft-warn when Gitea Actions secret upsert failed
      when:
        - _gitea_token_usable | bool
        - (_gitea_webhook_secret.status | default(0) | int) not in [201, 204]
      ansible.builtin.set_fact:
        ao_seed_warnings: >-
          {{
            ao_seed_warnings + [
              'Failed to set Gitea Actions secret AO_WEBHOOK_URL '
              ~ '(HTTP ' ~ (_gitea_webhook_secret.status | default('n/a') | string) ~ '). '
              ~ 'Set it manually to ' ~ _ao_cicd_webhook_url
            ]
          }}

    - name: Record Gitea webhook secret success for seed summary
      when:
        - _gitea_token_usable | bool
        - (_gitea_webhook_secret.status | default(0) | int) in [201, 204]
      ansible.builtin.set_fact:
        ao_gitea_webhook_secret_set: true
        ao_cicd_webhook_url: "{{ _ao_cicd_webhook_url }}"
