---
# AO webhook triggers require authorized_service_account_ids before publish.
# Ensure an APD CI/CD service account + client_credentials exist for lightwell-ci-cd.
- name: Skip AO CI/CD service account when no Gitea demos
  when: (ao_gitea_demos | default([]) | length) == 0
  ansible.builtin.debug:
    msg: Skipping AO CI/CD webhook service account — no requires_gitea demos enabled.

- name: Ensure AO CI/CD webhook service account
  when: (ao_gitea_demos | default([]) | length) > 0
  vars:
    _ao_cicd_sa_name: "{{ ao_cicd_service_account_name | default('APD CI/CD Webhook') }}"
  block:
    - name: Require AO demo project for service account
      ansible.builtin.assert:
        that:
          - (ao_demo_project_id | default('') | length) > 0
        fail_msg: ao_demo_project_id is required to create the CI/CD webhook service account.

    - name: List AO service accounts
      ansible.builtin.uri:
        url: "{{ ao_api_url }}/service_accounts?limit=100"
        method: GET
        headers:
          Authorization: "Bearer {{ ao_api_token }}"
        validate_certs: false
        return_content: true
        status_code: [200]
      register: ao_service_accounts
      no_log: true

    - name: Select existing AO CI/CD service account
      ansible.builtin.set_fact:
        ao_cicd_sa_existing: >-
          {{
            ao_service_accounts.json.resources
            | default(ao_service_accounts.json.results | default([]))
            | selectattr('name', 'equalto', _ao_cicd_sa_name)
            | selectattr('project_id', 'equalto', ao_demo_project_id)
            | list
            | first
            | default({})
          }}

    - name: Create AO CI/CD webhook service account
      when: ao_cicd_sa_existing | length == 0
      ansible.builtin.uri:
        url: "{{ ao_api_url }}/service_accounts"
        method: POST
        headers:
          Authorization: "Bearer {{ ao_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          name: "{{ _ao_cicd_sa_name }}"
          description: >-
            Authorized caller for the lightwell-ci-cd webhook (Gitea Actions).
            Created by APD AO Install.
          project_id: "{{ ao_demo_project_id }}"
        validate_certs: false
        status_code: [200, 201]
        return_content: true
      register: ao_cicd_sa_create
      no_log: true

    - name: Store AO CI/CD service account id
      ansible.builtin.set_fact:
        ao_cicd_sa_id: >-
          {{
            ao_cicd_sa_create.json.id
            if (ao_cicd_sa_create is defined and ao_cicd_sa_create is not skipped)
            else ao_cicd_sa_existing.id
          }}
      no_log: true

    # client_secret is returned only at create time — always mint a fresh
    # credential on Install so Gitea Actions secrets can be rewritten.
    - name: Create AO CI/CD service account client credentials
      ansible.builtin.uri:
        url: "{{ ao_api_url }}/service_accounts/{{ ao_cicd_sa_id }}/credentials"
        method: POST
        headers:
          Authorization: "Bearer {{ ao_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          credential_type: client_credentials
        validate_certs: false
        status_code: [200, 201]
        return_content: true
      register: ao_cicd_sa_cred
      no_log: true

    - name: Store AO CI/CD OAuth client facts for Gitea secrets
      ansible.builtin.set_fact:
        ao_cicd_client_id: "{{ ao_cicd_sa_cred.json.identifier }}"
        ao_cicd_client_secret: "{{ ao_cicd_sa_cred.json.client_secret }}"
        ao_cicd_token_url: "https://{{ ao_api_host }}/api/v1/auth/token"
        ao_cicd_sa_ready: true
      no_log: true
