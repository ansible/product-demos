---
# Create or update one file in the inventory-service repo (idempotent via sha).
- name: Look up inventory-service seed file {{ gitea_seed_file.path }}
  ansible.builtin.uri:
    url: >-
      http://127.0.0.1:{{ gitea_http_port }}/api/v1/repos/{{ gitea_repo_owner }}/{{ gitea_repo_name }}/contents/{{ gitea_seed_file.path }}?ref=main
    method: GET
    headers:
      Authorization: "token {{ gitea_api_token }}"
    status_code: [200, 404]
  register: gitea_seed_lookup
  no_log: true

- name: Write inventory-service seed file {{ gitea_seed_file.path }}
  ansible.builtin.uri:
    url: >-
      http://127.0.0.1:{{ gitea_http_port }}/api/v1/repos/{{ gitea_repo_owner }}/{{ gitea_repo_name }}/contents/{{ gitea_seed_file.path }}
    method: "{{ 'PUT' if gitea_seed_lookup.status == 200 else 'POST' }}"
    headers:
      Authorization: "token {{ gitea_api_token }}"
      Content-Type: application/json
    body_format: json
    body: >-
      {{
        {
          'message': gitea_seed_file.message,
          'branch': 'main',
          'content': gitea_seed_file.content | b64encode,
        }
        | combine(
            {'sha': gitea_seed_lookup.json.sha}
            if gitea_seed_lookup.status == 200 else {}
          )
      }}
    status_code: [200, 201]
  no_log: true
