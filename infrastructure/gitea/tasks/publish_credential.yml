---
# Upsert Controller "Gitea" credential from facts set by bootstrap_cicd.yml.
# Requires AAP Credential injectors (CONTROLLER_HOST + token or user/pass).
- name: Skip Gitea credential publish when token facts are missing
  when: hostvars['localhost'].gitea_credential_token is not defined
  ansible.builtin.debug:
    msg: >-
      Skipping Gitea Controller credential publish — CI/CD bootstrap did
      not set gitea_credential_token on localhost.

- name: Publish Gitea credential to Controller
  when: hostvars['localhost'].gitea_credential_token is defined
  vars:
    gitea_credential_name: Gitea
    gitea_credential_organization: Ansible Product Demos (APD)
    gitea_credential_type_name: Gitea
    _gt_controller_host_raw: >-
      {{ lookup('env', 'CONTROLLER_HOST') | default(lookup('env', 'AAP_HOSTNAME'), true)
         | default('', true) }}
    _gt_controller_host: "{{ _gt_controller_host_raw | regex_replace('/$', '') }}"
    _gt_controller_oauth_token: "{{ lookup('env', 'CONTROLLER_OAUTH_TOKEN') | default('', true) }}"
    _gt_controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') | default('', true) }}"
    _gt_controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') | default('', true) }}"
  block:
    - name: Require Controller API access for Gitea credential publish
      ansible.builtin.assert:
        that:
          - (_gt_controller_host | default('') | length) > 0
          - >-
            (_gt_controller_oauth_token | default('') | length) > 0
            or (
              (_gt_controller_username | default('') | length) > 0
              and (_gt_controller_password | default('') | length) > 0
            )
        fail_msg: >-
          Attach an AAP Credential to Infrastructure | AWS - Provision Gitea so
          CONTROLLER_HOST and CONTROLLER_OAUTH_TOKEN (or username/password)
          are available to publish the Gitea credential.

    - name: Build Controller API auth facts for Gitea
      ansible.builtin.set_fact:
        _gt_controller_api: "{{ _gt_controller_host }}/api/controller/v2"
        _gt_controller_use_token: "{{ (_gt_controller_oauth_token | default('') | length) > 0 }}"
      no_log: true

    - name: Look up APD organization for Gitea credential
      ansible.builtin.uri:
        url: "{{ _gt_controller_api }}/organizations/?name={{ gitea_credential_organization | urlencode }}"
        method: GET
        headers: >-
          {{
            {'Authorization': 'Bearer ' ~ _gt_controller_oauth_token, 'Content-Type': 'application/json'}
            if _gt_controller_use_token | bool
            else {'Content-Type': 'application/json'}
          }}
        user: "{{ _gt_controller_username if not (_gt_controller_use_token | bool) else omit }}"
        password: "{{ _gt_controller_password if not (_gt_controller_use_token | bool) else omit }}"
        force_basic_auth: "{{ not (_gt_controller_use_token | bool) }}"
        validate_certs: false
        return_content: true
        status_code: [200]
      register: _gt_org_lookup
      no_log: true

    - name: Require APD organization for Gitea
      ansible.builtin.assert:
        that:
          - _gt_org_lookup.json.results | default([]) | length > 0
        fail_msg: "Organization '{{ gitea_credential_organization }}' was not found in Controller."

    - name: Look up Gitea credential type
      ansible.builtin.uri:
        url: "{{ _gt_controller_api }}/credential_types/?name={{ gitea_credential_type_name | urlencode }}"
        method: GET
        headers: >-
          {{
            {'Authorization': 'Bearer ' ~ _gt_controller_oauth_token, 'Content-Type': 'application/json'}
            if _gt_controller_use_token | bool
            else {'Content-Type': 'application/json'}
          }}
        user: "{{ _gt_controller_username if not (_gt_controller_use_token | bool) else omit }}"
        password: "{{ _gt_controller_password if not (_gt_controller_use_token | bool) else omit }}"
        force_basic_auth: "{{ not (_gt_controller_use_token | bool) }}"
        validate_certs: false
        return_content: true
        status_code: [200]
      register: _gt_cred_type_lookup
      no_log: true

    - name: Require Gitea credential type
      ansible.builtin.assert:
        that:
          - _gt_cred_type_lookup.json.results | default([]) | length > 0
        fail_msg: >-
          Credential type '{{ gitea_credential_type_name }}' was not found.
          Re-run APD infrastructure setup so controller_credential_types includes Gitea.

    - name: Look up Gitea Credential
      ansible.builtin.uri:
        url: "{{ _gt_controller_api }}/credentials/?name={{ gitea_credential_name | urlencode }}"
        method: GET
        headers: >-
          {{
            {'Authorization': 'Bearer ' ~ _gt_controller_oauth_token, 'Content-Type': 'application/json'}
            if _gt_controller_use_token | bool
            else {'Content-Type': 'application/json'}
          }}
        user: "{{ _gt_controller_username if not (_gt_controller_use_token | bool) else omit }}"
        password: "{{ _gt_controller_password if not (_gt_controller_use_token | bool) else omit }}"
        force_basic_auth: "{{ not (_gt_controller_use_token | bool) }}"
        validate_certs: false
        return_content: true
        status_code: [200]
      register: _gt_cred_lookup
      no_log: true

    - name: Build Gitea credential payload
      ansible.builtin.set_fact:
        _gt_cred_payload:
          name: "{{ gitea_credential_name }}"
          description: Updated automatically by Infrastructure | AWS - Provision Gitea.
          organization: "{{ _gt_org_lookup.json.results[0].id | int }}"
          credential_type: "{{ _gt_cred_type_lookup.json.results[0].id | int }}"
          inputs:
            gitea_host: "{{ hostvars['localhost'].gitea_credential_host }}"
            gitea_port: "{{ hostvars['localhost'].gitea_credential_port | string }}"
            gitea_token: "{{ hostvars['localhost'].gitea_credential_token }}"
            gitea_owner: "{{ hostvars['localhost'].gitea_credential_owner }}"
            gitea_repo: "{{ hostvars['localhost'].gitea_credential_repo }}"
      no_log: true

    - name: Create Gitea Credential
      when: _gt_cred_lookup.json.results | default([]) | length == 0
      ansible.builtin.uri:
        url: "{{ _gt_controller_api }}/credentials/"
        method: POST
        headers: >-
          {{
            {'Authorization': 'Bearer ' ~ _gt_controller_oauth_token, 'Content-Type': 'application/json'}
            if _gt_controller_use_token | bool
            else {'Content-Type': 'application/json'}
          }}
        user: "{{ _gt_controller_username if not (_gt_controller_use_token | bool) else omit }}"
        password: "{{ _gt_controller_password if not (_gt_controller_use_token | bool) else omit }}"
        force_basic_auth: "{{ not (_gt_controller_use_token | bool) }}"
        body_format: json
        body: "{{ _gt_cred_payload }}"
        validate_certs: false
        status_code: [200, 201]
      no_log: true

    - name: Update Gitea Credential
      when: _gt_cred_lookup.json.results | default([]) | length > 0
      ansible.builtin.uri:
        url: "{{ _gt_controller_api }}/credentials/{{ _gt_cred_lookup.json.results[0].id }}/"
        method: PATCH
        headers: >-
          {{
            {'Authorization': 'Bearer ' ~ _gt_controller_oauth_token, 'Content-Type': 'application/json'}
            if _gt_controller_use_token | bool
            else {'Content-Type': 'application/json'}
          }}
        user: "{{ _gt_controller_username if not (_gt_controller_use_token | bool) else omit }}"
        password: "{{ _gt_controller_password if not (_gt_controller_use_token | bool) else omit }}"
        force_basic_auth: "{{ not (_gt_controller_use_token | bool) }}"
        body_format: json
        body: "{{ _gt_cred_payload }}"
        validate_certs: false
        status_code: [200]
      no_log: true

    - name: Show Gitea credential publish result
      ansible.builtin.debug:
        msg:
          - "Controller credential '{{ gitea_credential_name }}' updated."
          - >-
            host={{ hostvars['localhost'].gitea_credential_host }}:{{ hostvars['localhost'].gitea_credential_port }}
            repo={{ hostvars['localhost'].gitea_credential_owner }}/{{ hostvars['localhost'].gitea_credential_repo }}
          - "AO Install attaches this credential to CI/CD Demo job templates."
          - "Set Gitea Actions secret AO_WEBHOOK_URL after AO Install (webhook lightwell-ci-cd)."
