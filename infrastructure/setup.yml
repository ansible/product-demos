---
controller_credential_types:
  - name: ROSA Token
    kind: cloud
    inputs:
      fields:
        - id: rosa_token
          type: string
          label: ROSA API Token
          secret: true
          help_text: >-
            Obtain from https://console.redhat.com/openshift/token/rosa.
            This token authenticates the ROSA CLI with Red Hat OpenShift Cluster Manager.
      required:
        - rosa_token
    injectors:
      extra_vars:
        rosa_token: !unsafe '{{ rosa_token }}'

controller_credentials:
  - name: ROSA Token
    credential_type: ROSA Token
    organization: Ansible Product Demos (APD)
    update_secrets: false
    state: exists
    inputs:
      rosa_token: REPLACEME
  - name: OpenShift Credential
    organization: Ansible Product Demos (APD)
    credential_type: OpenShift or Kubernetes API Bearer Token
    update_secrets: false
    state: exists
    inputs:
      host: CHANGEME
      bearer_token: CHANGEME
      verify_ssl: false

controller_execution_environments:
  - name: ROSA Lifecycle EE
    image: quay.io/acme_corp/rosa-ee:latest
    organization: Ansible Product Demos (APD)
    pull: missing
  - name: AO Execution Environment
    image: quay.io/acme_corp/ao-ee:latest
    organization: Ansible Product Demos (APD)

controller_templates:
  - name: Infrastructure | ROSA - Preflight Checks
    description: >-
      Validates AWS credentials, ROSA token, permissions, quota,
      and checks for existing cluster name conflicts.
    job_type: run
    organization: Ansible Product Demos (APD)
    execution_environment: ROSA Lifecycle EE
    credentials:
      - AWS
      - ROSA Token
    project: Ansible Product Demos
    playbook: infrastructure/rosa/preflight.yml
    inventory: Ansible Product Demos Inventory
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Cluster Name
          question_description: >-
            Lowercase alphanumeric + hyphens, max 54 chars. Convention: apd-rosa-<purpose>
          type: text
          variable: rosa_cluster_name
          required: true
          default: apd-rosa-demo
        - question_name: AWS Region
          type: multiplechoice
          variable: rosa_aws_region
          required: true
          default: us-east-1
          choices:
            - us-east-1
            - us-east-2
            - us-west-2
            - eu-west-1

  - name: Infrastructure | ROSA - Create Cluster
    description: >-
      Initiates ROSA cluster creation with STS mode.
      Does NOT wait for readiness—use the workflow or Wait job.
    job_type: run
    organization: Ansible Product Demos (APD)
    execution_environment: ROSA Lifecycle EE
    credentials:
      - AWS
      - ROSA Token
    project: Ansible Product Demos
    playbook: infrastructure/rosa/create.yml
    inventory: Ansible Product Demos Inventory
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Cluster Name
          question_description: Must match what was validated in preflight.
          type: text
          variable: rosa_cluster_name
          required: true
          default: apd-rosa-demo
        - question_name: AWS Region
          type: multiplechoice
          variable: rosa_aws_region
          required: true
          default: us-east-1
          choices:
            - us-east-1
            - us-east-2
            - us-west-2
            - eu-west-1
        - question_name: Compute Nodes
          type: multiplechoice
          variable: rosa_compute_nodes
          required: true
          default: "2"
          choices:
            - "2"
            - "3"
            - "4"
        - question_name: Machine Type
          type: multiplechoice
          variable: rosa_compute_machine_type
          required: true
          default: m5.xlarge
          choices:
            - m5.xlarge
            - m5.2xlarge
            - m5.4xlarge
        - question_name: OpenShift Version (blank = latest)
          type: text
          variable: rosa_version
          required: false
          default: ''
        - question_name: Cluster TTL (e.g. 4h, 8h)
          question_description: Tag for cost tracking. Actual deletion requires Destroy job.
          type: text
          variable: rosa_ttl
          required: true
          default: "4h"
        - question_name: Owner Tag
          question_description: Identifies who owns this cluster for cost/cleanup.
          type: text
          variable: rosa_owner_tag
          required: true
          default: apd-demo

  - name: Infrastructure | ROSA - Wait for Ready
    description: >-
      Polls cluster status until ready (default timeout: 60min).
      Creates cluster-admin credentials on success.
    job_type: run
    organization: Ansible Product Demos (APD)
    execution_environment: ROSA Lifecycle EE
    credentials:
      - AWS
      - ROSA Token
    project: Ansible Product Demos
    playbook: infrastructure/rosa/wait.yml
    inventory: Ansible Product Demos Inventory
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    timeout: 3900
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Cluster Name
          type: text
          variable: rosa_cluster_name
          required: true
          default: apd-rosa-demo
        - question_name: AWS Region
          type: multiplechoice
          variable: rosa_aws_region
          required: true
          default: us-east-1
          choices:
            - us-east-1
            - us-east-2
            - us-west-2
            - eu-west-1

  - name: Infrastructure | ROSA - Destroy Cluster
    description: >-
      Destroys a ROSA cluster and cleans up STS operator roles
      and OIDC provider. Idempotent (safe to run if cluster is gone).
    job_type: run
    organization: Ansible Product Demos (APD)
    execution_environment: ROSA Lifecycle EE
    credentials:
      - AWS
      - ROSA Token
    project: Ansible Product Demos
    playbook: infrastructure/rosa/destroy.yml
    inventory: Ansible Product Demos Inventory
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    timeout: 2100
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Cluster Name
          type: text
          variable: rosa_cluster_name
          required: true
          default: apd-rosa-demo
        - question_name: AWS Region
          type: multiplechoice
          variable: rosa_aws_region
          required: true
          default: us-east-1
          choices:
            - us-east-1
            - us-east-2
            - us-west-2
            - eu-west-1

  - name: Infrastructure | Automation Orchestrator | Install
    description: >-
      Deploys Automation Orchestrator on an existing OpenShift cluster using
      aapctl. Installs CloudNativePG operator, PostgreSQL database, and the
      AO operator in a single automated step.
    job_type: run
    inventory: Ansible Product Demos Inventory
    project: "Ansible Product Demos"
    playbook: "infrastructure/ao/install.yml"
    execution_environment: AO Execution Environment
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    timeout: 3600
    extra_vars:
      ao_operator_channel: stable
    credentials:
      - OpenShift Credential

  - name: Infrastructure | Automation Orchestrator | Uninstall
    description: >-
      Removes Automation Orchestrator, CloudNativePG cluster, operators,
      and both namespaces.
    job_type: run
    inventory: Ansible Product Demos Inventory
    project: "Ansible Product Demos"
    playbook: "infrastructure/ao/uninstall.yml"
    execution_environment: AO Execution Environment
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    credentials:
      - OpenShift Credential

  - name: Infrastructure | HashiCorp Vault
    job_type: run
    inventory: Ansible Product Demos Inventory
    project: "Ansible Product Demos"
    playbook: "infrastructure/hashicorp_vault.yml"
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Operation
          type: multiplechoice
          variable: vault_operation
          required: true
          default: install
          choices:
            - install
            - uninstall
    credentials:
      - OpenShift Credential
      - AAP Credential

  - name: Infrastructure | OPA - Deploy Open Policy Agent on OpenShift
    description: >-
      Deploys Open Policy Agent on OpenShift and configures AAP's
      Policy as Code settings to use the new OPA server. All .rego
      policy files are loaded into a ConfigMap and mounted into the
      OPA container.
    job_type: run
    organization: Ansible Product Demos (APD)
    credentials:
      - OpenShift Credential
      - AAP Credential
    project: Ansible Product Demos
    playbook: infrastructure/opa/deploy-opa.yml
    inventory: Ansible Product Demos Inventory
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: OPA namespace
          question_description: >-
            OpenShift project/namespace for the OPA deployment
          type: text
          variable: opa_namespace
          required: true
          default: opa
        - question_name: OPA container image
          type: text
          variable: opa_image
          required: true
          default: docker.io/openpolicyagent/opa:latest-static

  - name: Infrastructure | OPA - Add Policy
    description: >-
      Uploads a Rego policy to OPA via the REST API. Policies added
      this way are stored in memory only and will not survive an OPA
      pod restart.
    job_type: run
    organization: Ansible Product Demos (APD)
    credentials:
      - OpenShift Credential
    project: Ansible Product Demos
    playbook: infrastructure/opa/add-policy.yml
    inventory: Ansible Product Demos Inventory
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: OPA namespace
          question_description: >-
            OpenShift project/namespace where OPA is deployed
          type: text
          variable: opa_namespace
          required: true
          default: opa
        - question_name: Policy name
          question_description: >-
            Unique identifier for the policy (e.g. aap_syntax_check)
          type: text
          variable: opa_policy_name
          required: true
        - question_name: Rego policy text
          question_description: >-
            Rego policy code to upload to OPA
          type: textarea
          variable: opa_policy_text
          required: true

  - name: "Infrastructure | AWS - Provision Kafka Queue"
    description: >-
      Provisions a dedicated aws_kafka EC2 instance and deploys single-node
      Podman KRaft Kafka with topic linux-audit-events.
    job_type: run
    organization: Ansible Product Demos (APD)
    credentials:
      - AWS
      - APD Machine Credential
    project: Ansible Product Demos
    playbook: infrastructure/config-drift/playbooks/provision_kafka.yml
    inventory: Ansible Product Demos Inventory
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: AWS Region
          type: multiplechoice
          variable: create_vm_aws_region
          required: true
          default: us-east-2
          choices:
            - us-east-1
            - us-east-2
            - us-west-1
            - us-west-2
        - question_name: Owner
          question_description: >-
            Must match the owner tag on your existing cloud stack VMs.
          type: text
          variable: create_vm_aws_owner_tag
          required: true
          default: your_name
        - question_name: Environment
          type: multiplechoice
          variable: create_vm_vm_environment
          required: true
          default: Prod
          choices:
            - Dev
            - QA
            - Prod
        - question_name: Deployment
          type: text
          variable: create_vm_vm_deployment
          required: true
          default: cloud_stack
        - question_name: Subnet
          type: text
          variable: create_vm_aws_vpc_subnet_name
          required: true
          default: aws-test-subnet
        - question_name: Security Group
          type: text
          variable: create_vm_aws_securitygroup_name
          required: true
          default: aws-test-sg
        - question_name: SSH Keypair
          type: text
          variable: create_vm_aws_keypair_name
          required: true
          default: aws-test-key

  - name: "LINUX | Config Drift - Deploy Audit and Filebeat"
    description: >-
      Deploys persistent auditd rules that watch /etc/ssh/sshd_config for writes
      and attribute changes, and installs Filebeat with the auditd module.
      Use Filebeat output kafka after provisioning the Kafka queue.
    job_type: run
    inventory: Ansible Product Demos Inventory
    project: Ansible Product Demos
    playbook: infrastructure/config-drift/playbooks/deploy_audit_filebeat.yml
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    credentials:
      - APD Machine Credential
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Server Name or Pattern
          question_description: >-
            Default is aws_rhel* (aws_rhel8 and aws_rhel9). Use aws_rhel9 for
            one host only. Unreachable hosts are skipped. reports is not matched
            by aws_rhel*.
          type: text
          variable: _hosts
          required: true
          default: aws_rhel*
        - question_name: Filebeat output
          type: multiplechoice
          variable: config_drift_filebeat_output
          required: true
          default: console
          choices:
            - console
            - kafka

controller_workflows:
  - name: Infrastructure | ROSA - Lifecycle (Create)
    description: >-
      End-to-end ROSA cluster creation: preflight checks, create,
      wait for readiness. On failure, attempts cleanup via destroy.
    organization: Ansible Product Demos (APD)
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Cluster Name
          question_description: >-
            Convention: apd-rosa-<purpose>. Lowercase, alphanumeric + hyphens, max 54 chars.
          type: text
          variable: rosa_cluster_name
          required: true
          default: apd-rosa-demo
        - question_name: AWS Region
          type: multiplechoice
          variable: rosa_aws_region
          required: true
          default: us-east-1
          choices:
            - us-east-1
            - us-east-2
            - us-west-2
            - eu-west-1
        - question_name: Compute Nodes
          type: multiplechoice
          variable: rosa_compute_nodes
          required: true
          default: "2"
          choices:
            - "2"
            - "3"
            - "4"
        - question_name: Machine Type
          type: multiplechoice
          variable: rosa_compute_machine_type
          required: true
          default: m5.xlarge
          choices:
            - m5.xlarge
            - m5.2xlarge
            - m5.4xlarge
        - question_name: OpenShift Version (blank = latest)
          type: text
          variable: rosa_version
          required: false
          default: ''
        - question_name: Cluster TTL
          type: text
          variable: rosa_ttl
          required: true
          default: "4h"
        - question_name: Owner Tag
          type: text
          variable: rosa_owner_tag
          required: true
          default: apd-demo
    simplified_workflow_nodes:
      - identifier: Preflight Checks
        unified_job_template: Infrastructure | ROSA - Preflight Checks
        success_nodes:
          - Create Cluster
        failure_nodes:
          - Preflight Failed
      - identifier: Create Cluster
        unified_job_template: Infrastructure | ROSA - Create Cluster
        success_nodes:
          - Wait for Ready
        failure_nodes:
          - Destroy on Failure
      - identifier: Wait for Ready
        unified_job_template: Infrastructure | ROSA - Wait for Ready
        failure_nodes:
          - Destroy on Failure
      - identifier: Destroy on Failure
        unified_job_template: Infrastructure | ROSA - Destroy Cluster
        always_nodes:
          - Creation Failed
      - identifier: Preflight Failed
        unified_job_template: 'SUBMIT FEEDBACK'
        extra_data:
          feedback: >-
            ROSA preflight checks failed. Check AWS credentials,
            ROSA token, and service quotas.
      - identifier: Creation Failed
        unified_job_template: 'SUBMIT FEEDBACK'
        extra_data:
          feedback: >-
            ROSA cluster creation failed. Destroy attempted for cleanup.
            Check job output for details.

  - name: Infrastructure | ROSA - Lifecycle (Destroy)
    description: >-
      Safely destroys a ROSA cluster with confirmation.
      Idempotent—safe to run even if cluster no longer exists.
    organization: Ansible Product Demos (APD)
    notification_templates_started: Telemetry
    notification_templates_success: Telemetry
    notification_templates_error: Telemetry
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Cluster Name
          question_description: >-
            Name of the ROSA cluster to destroy.
          type: text
          variable: rosa_cluster_name
          required: true
          default: apd-rosa-demo
        - question_name: AWS Region
          type: multiplechoice
          variable: rosa_aws_region
          required: true
          default: us-east-1
          choices:
            - us-east-1
            - us-east-2
            - us-west-2
            - eu-west-1
    simplified_workflow_nodes:
      - identifier: Destroy Cluster
        unified_job_template: Infrastructure | ROSA - Destroy Cluster
        failure_nodes:
          - Destroy Failed
      - identifier: Destroy Failed
        unified_job_template: 'SUBMIT FEEDBACK'
        extra_data:
          feedback: >-
            ROSA cluster destruction failed. Manual cleanup may be required.
            Check AWS console for orphaned resources (VPCs, IAM roles, CloudFormation stacks).
