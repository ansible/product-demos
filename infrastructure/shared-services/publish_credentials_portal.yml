---
# Publish a password-gated static site with this lab's shared-service logins.
# Expects Mattermost, Gitea, and OpenFlake Controller credentials attached so
# injectors populate mattermost_*, gitea_*, openflake_* extra vars.
- name: Publish Shared Services credentials portal
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Extra vars / survey can override; do not self-reference (Jinja recursion).
    ss_portal_password: Ansible123!
    ss_portal_region: "{{ create_vm_aws_region | default('us-east-2') }}"
    ss_portal_mm_username: apdadmin
    ss_portal_mm_password: Ansible123!
    ss_portal_gitea_username: apdadmin
    ss_portal_gitea_password: Ansible123!
  tasks:
    - name: Require injected shared-service credential vars
      ansible.builtin.assert:
        that:
          - mattermost_server is defined
          - mattermost_server | length > 0
          - mattermost_server != 'REPLACEME'
          - gitea_host is defined
          - gitea_host | length > 0
          - gitea_host != 'REPLACEME'
          - openflake_instance_url is defined
          - openflake_instance_url | length > 0
          - openflake_instance_url != 'REPLACEME'
          - openflake_username is defined
          - openflake_username | length > 0
          - openflake_password is defined
          - openflake_password | length > 0
          - openflake_password != 'REPLACEME'
        fail_msg: >-
          Shared-service Controller credentials are missing or still stubs.
          Run Infrastructure | AWS - Deploy Shared Services (or Provision
          Mattermost, Provision Gitea, and OpenFlake) before publishing the
          credentials portal. Attach the Mattermost, Gitea, and OpenFlake
          credentials to this job template.

    - name: Get AWS account ID
      amazon.aws.aws_caller_info:
      register: ss_portal_caller

    - name: Set portal bucket and object prefix
      ansible.builtin.set_fact:
        ss_portal_bucket_name: "apd-ss-portal-{{ ss_portal_caller.account }}"
        ss_portal_object_prefix: "{{ gitea_host }}"

    - name: Build credentials payload
      ansible.builtin.set_fact:
        ss_portal_payload:
          services:
            - name: Mattermost
              url: "http://{{ mattermost_server }}"
              username: "{{ ss_portal_mm_username }}"
              password: "{{ ss_portal_mm_password }}"
            - name: Gitea
              url: "http://{{ gitea_host }}:{{ gitea_port | default('3000') }}"
              username: "{{ ss_portal_gitea_username }}"
              password: "{{ ss_portal_gitea_password }}"
              note: >-
                Repo {{ gitea_owner | default('apdadmin') }}/{{ gitea_repo | default('inventory-service') }}
            - name: OpenFlake
              url: "{{ openflake_instance_url }}"
              username: "{{ openflake_username }}"
              password: "{{ openflake_password }}"
      no_log: true

    # Use the Ansible interpreter (has cryptography via ansible-core), not a
    # bare python3 that may lack it on the controller node / EE.
    - name: Encrypt portal payload with AES-GCM
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - |
            import base64, json, os, sys
            from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC
            from cryptography.hazmat.primitives import hashes
            from cryptography.hazmat.primitives.ciphers.aead import AESGCM

            password = os.environ["SS_PORTAL_PASSWORD"].encode("utf-8")
            plaintext = os.environ["SS_PORTAL_PAYLOAD"].encode("utf-8")
            salt = os.urandom(16)
            nonce = os.urandom(12)
            kdf = PBKDF2HMAC(
                algorithm=hashes.SHA256(),
                length=32,
                salt=salt,
                iterations=100000,
            )
            key = kdf.derive(password)
            ciphertext = AESGCM(key).encrypt(nonce, plaintext, None)
            json.dump(
                {
                    "salt": base64.b64encode(salt).decode("ascii"),
                    "nonce": base64.b64encode(nonce).decode("ascii"),
                    "ciphertext": base64.b64encode(ciphertext).decode("ascii"),
                },
                sys.stdout,
                separators=(",", ":"),
            )
      environment:
        SS_PORTAL_PASSWORD: "{{ ss_portal_password }}"
        SS_PORTAL_PAYLOAD: "{{ ss_portal_payload | to_json }}"
      register: ss_portal_encrypt
      changed_when: false
      no_log: true

    - name: Store ciphertext for template
      ansible.builtin.set_fact:
        ss_portal_ciphertext_json: "{{ ss_portal_encrypt.stdout }}"
      no_log: true

    - name: Render portal index.html
      ansible.builtin.tempfile:
        state: directory
        suffix: -ss-portal
      register: ss_portal_tmpdir

    - name: Write index.html
      ansible.builtin.template:
        src: index.html.j2
        dest: "{{ ss_portal_tmpdir.path }}/index.html"
        mode: "0644"
      no_log: true

    - name: Create portal bucket
      amazon.aws.s3_bucket:
        name: "{{ ss_portal_bucket_name }}"
        region: "{{ ss_portal_region }}"
        state: present
        policy: "{{ lookup('ansible.builtin.template', 'policy.json') }}"
        public_access:
          block_public_acls: false
          block_public_policy: false
          ignore_public_acls: false
          restrict_public_buckets: false

    - name: Configure bucket for website hosting
      community.aws.s3_website:
        name: "{{ ss_portal_bucket_name }}"
        state: present
        suffix: index.html

    - name: Upload portal index.html
      amazon.aws.s3_object:
        bucket: "{{ ss_portal_bucket_name }}"
        object: "{{ ss_portal_object_prefix }}/index.html"
        src: "{{ ss_portal_tmpdir.path }}/index.html"
        mode: put
        overwrite: always
        permission: public-read
        headers:
          ContentType: "text/html; charset=utf-8"
          ContentDisposition: inline

    - name: Remove local portal tempdir
      ansible.builtin.file:
        path: "{{ ss_portal_tmpdir.path }}"
        state: absent

    - name: Set portal URL
      ansible.builtin.set_fact:
        ss_portal_url: >-
          http://{{ ss_portal_bucket_name }}.s3-website-{{ ss_portal_region }}.amazonaws.com/{{ ss_portal_object_prefix }}/

    # Last task on purpose — scroll to the bottom of the job (or the nested
    # Shared Services node) for the portal URL and password.
    - name: Report credentials portal
      ansible.builtin.debug:
        msg:
          - '============================================================'
          - 'Shared Services credentials portal (copy from here)'
          - '============================================================'
          - 'Portal URL:      {{ ss_portal_url }}'
          - 'Portal password: {{ ss_portal_password }}'
          - 'Mattermost, Gitea, and OpenFlake logins unlock after the portal password.'
