---
name: pre-commit
on:
  - push
  - pull_request

# all other scopes (issues, PRs, etc.) become 'none'
permissions:
  contents: read

jobs:
  pre-commit-27:
    container:
      image: quay.io/ansible-product-demos/apd-ee-27
      options: --user root
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: ./.github/workflows/run-pc.sh
      shell: bash
