---
- name: Manage AD resources in Controller
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Assert domain details are available
      ansible.builtin.assert:
        that:
          - ad_domain_name is defined
          - ad_domain_controller_host is defined
          - ad_resource_state is defined
        fail_msg: "Domain details are not available"
        success_msg: "Domain details are available"

    - name: Update Kerberos Credential
      when: ad_resource_state == 'present'
      ansible.controller.credential:
        name: Kerberos Credential
        credential_type: Kerberos
        organization: Ansible Product Demos (APD)
        inputs:
          username: "{{ ansible_user }}@{{ ad_domain_name | upper }}"
          password: "{{ ansible_password }}"
          default_realm: "{{ ad_domain_name | upper }}"
          kdc: "{{ ad_domain_controller_host }}"

    - name: Update Microsoft AD LDAP Credential
      when: ad_resource_state == 'present'
      ansible.controller.credential:
        name: Microsoft AD LDAP Credential
        credential_type: Microsoft AD LDAP
        organization: Ansible Product Demos (APD)
        inputs:
          username: "{{ ansible_user }}@{{ ad_domain_name | upper }}"
          password: "{{ ansible_password }}"
          server: "{{ ad_domain_controller_host }}"

    - name: Reset Kerberos Credential
      when: ad_resource_state == 'absent'
      ansible.controller.credential:
        name: Kerberos Credential
        credential_type: Kerberos
        organization: Ansible Product Demos (APD)
        inputs:
          username: ec2-user@ANSIBLE.LOCAL
          password: REPLACEME
          default_realm: ANSIBLE.LOCAL
          kdc: REPLACEME

    - name: Reset Microsoft AD LDAP Credential
      when: ad_resource_state == 'absent'
      ansible.controller.credential:
        name: Microsoft AD LDAP Credential
        credential_type: Microsoft AD LDAP
        organization: Ansible Product Demos (APD)
        inputs:
          username: ec2-user@ANSIBLE.LOCAL
          password: REPLACEME
          server: REPLACEME

    - name: Manage AD LDAP inventory source
      ansible.controller.inventory_source:
        name: AD LDAP Inventory
        inventory: Windows AD Inventory
        source: scm
        source_project: Ansible Product Demos
        source_path: windows/inventory.microsoft.ad.ldap.yml
        credential: Microsoft AD LDAP Credential
        overwrite: true
        update_on_launch: false
        update_on_project_update: false
        state: "{{ ad_resource_state }}"
