---
- name: Connectivity test
  hosts: "{{ _hosts | default('os_windows') }}"
  gather_facts: false
  # Defaults when limiting to one host (survey _hosts): group vars are not always
  # merged before Ansible picks the connection plugin (SSH was used on port 22).
  vars:
    ansible_connection: "{{ ansible_connection | default('winrm') }}"
    ansible_user: ec2-user
    ansible_port: "{{ ansible_port | default(5986) }}"
    ansible_winrm_transport: "{{ ansible_winrm_transport | default('credssp') }}"
    ansible_winrm_server_cert_validation: "{{ ansible_winrm_server_cert_validation | default('ignore') }}"

  tasks:
    - name: Wait 600 seconds for target connection to become reachable/usable
      ansible.builtin.wait_for_connection:
        connect_timeout: "{{ wait_for_timeout_sec | default(5) }}"
        delay: "{{ wait_for_delay_sec | default(0) }}"
        sleep: "{{ wait_for_sleep_sec | default(1) }}"
        timeout: "{{ wait_for_timeout_sec | default(300) }}"

    - name: Ping the windows host
      ansible.windows.win_ping:
