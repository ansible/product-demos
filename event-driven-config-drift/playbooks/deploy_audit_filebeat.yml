---
- name: Deploy auditd and optional Filebeat for config drift detection
  hosts: "{{ _hosts | default(omit) }}"
  become: true
  vars:
    config_drift_deploy_filebeat: "{{ deploy_filebeat | default(false) | bool }}"

  tasks:
    - name: Check OS family
      ansible.builtin.assert:
        that: ansible_os_family == 'RedHat'
        fail_msg: This demo supports RHEL hosts only.

    - name: Configure auditd monitoring for sshd_config
      ansible.builtin.include_role:
        name: demo.config_drift.audit_filebeat
